<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eagle Panorama</title>
  <meta name="description" content="A knowledge atlas: see how ideas connect, what to learn first, and how deep a subject goes." />
  <meta name="theme-color" content="#0c1014" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0c1014;
      --surface: #151a20;
      --surface-2: #1c232c;
      --fg: #e8ece4;
      --muted: #9aa39a;
      --subtle: #6f786f;
      --border: color-mix(in oklab, #e8ece4 14%, transparent);
      --accent: #8eb4c9;
      --primary: #e8ece4;
      --primary-fg: #12160f;
      --font-display: "Fraunces", "Iowan Old Style", Palatino, serif;
      --font-sans: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font-sans); line-height: 1.5; }
    body { background: radial-gradient(1200px 600px at 50% -10%, color-mix(in oklab, var(--accent) 14%, transparent), transparent 60%), var(--bg); }
    h1, h2, .display { font-family: var(--font-display); letter-spacing: -0.03em; line-height: 1.15; font-weight: 600; }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; font-family: inherit; }
    header { position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--border); background: color-mix(in oklab, var(--bg) 86%, transparent); backdrop-filter: blur(10px); }
    .bar { max-width: 1100px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; min-height: 44px; }
    .mark { width: 36px; height: 36px; border: 1px solid var(--border); border-radius: 8px; display: grid; place-items: center; color: var(--accent); }
    nav { display: flex; gap: 4px; }
    nav a { height: 44px; padding: 0 12px; border-radius: 8px; color: var(--muted); font-size: 14px; display: inline-flex; align-items: center; }
    nav a.active, nav a:hover { background: var(--surface-2); color: var(--fg); }
    main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 80px; }
    .hero { text-align: center; padding: 48px 0 24px; }
    .kicker { font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin: 0; }
    h1 { font-size: clamp(2rem, 6vw, 3.6rem); margin: 12px 0; }
    .lede { color: var(--muted); max-width: 40rem; margin: 0 auto 28px; font-size: 1.125rem; }
    .lede.left { margin-left: 0; text-align: left; }
    .search { display: flex; flex-wrap: wrap; gap: 10px; max-width: 42rem; margin: 0 auto; text-align: left; }
    input[type="text"] { height: 48px; flex: 1; min-width: 12rem; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--fg); padding: 0 14px; font-size: 16px; outline: none; }
    input:focus { box-shadow: 0 0 0 2px var(--accent); }
    .btn { height: 48px; padding: 0 20px; border: 0; border-radius: 8px; background: var(--primary); color: var(--primary-fg); font-weight: 600; font-size: 14px; }
    .btn.secondary { background: var(--surface-2); color: var(--fg); border: 1px solid var(--border); }
    .btn.sm { height: 40px; padding: 0 12px; font-size: 13px; text-transform: capitalize; }
    .btn:disabled { opacity: 0.45; cursor: default; }
    .chips, .row { display: flex; flex-wrap: wrap; gap: 8px; }
    .chips { justify-content: center; margin-top: 20px; }
    .row { margin-top: 12px; }
    .chip { min-height: 40px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--fg); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
    .chip:hover, .chip.on { border-color: var(--accent); }
    .chip.depth { flex-direction: column; align-items: flex-start; height: auto; background: transparent; }
    .steps { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 28px; }
    .steps span { height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; }
    .grid, .concepts { display: grid; gap: 12px; }
    .grid { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-top: 20px; }
    .card { border: 1px solid var(--border); background: var(--surface); border-radius: 16px; padding: 20px; display: block; }
    .card:hover { border-color: var(--accent); }
    .card.inset { margin-top: 12px; }
    .display { font-size: 1.15rem; }
    .muted { color: var(--muted); }
    .subtle { color: var(--subtle); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
    .subtle.plain { text-transform: none; letter-spacing: 0; margin-top: 6px; }
    .error { color: var(--accent); font-size: 14px; margin: 10px auto 0; max-width: 42rem; }
    .suggest { border: 1px solid var(--border); background: var(--surface); border-radius: 12px; margin: 10px auto 0; overflow: hidden; max-width: 42rem; text-align: left; }
    .suggest button { display: flex; width: 100%; justify-content: space-between; gap: 12px; background: transparent; border: 0; color: var(--fg); padding: 12px 16px; min-height: 44px; font-size: 14px; }
    .suggest button:hover { background: var(--surface-2); }
    .board-wrap { border: 1px solid var(--border); background: var(--surface); border-radius: 16px; padding: 10px; margin-top: 20px; }
    .board { height: min(72vh, 720px); overflow: hidden; border-radius: 10px; background: #eef1e8; cursor: grab; touch-action: none; }
    .legend { color: var(--muted); font-size: 12px; margin: 8px 4px 2px; }
    .section { margin-top: 36px; }
    .depth-copy { margin-top: 16px; }
    .choice { display: block; width: 100%; text-align: left; min-height: 44px; border: 1px solid var(--border); background: transparent; color: var(--fg); border-radius: 8px; padding: 10px 12px; margin-top: 8px; }
    .choice.sel { border-color: var(--accent); background: var(--surface-2); }
    .check-row { margin-top: 16px; }
    .link { color: var(--accent); }
    #codebox { display: none; position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.72); padding: 16px; }
    #codebox.open { display: flex; flex-direction: column; gap: 10px; }
    #codebox textarea { flex: 1; width: 100%; min-height: 50vh; border-radius: 8px; border: 1px solid var(--border); background: #10140f; color: var(--fg); padding: 12px; font: 12px/1.45 ui-monospace, monospace; }
    #codebox .bar2 { display: flex; gap: 8px; align-items: center; justify-content: space-between; color: var(--fg); }
    footer.note { color: var(--subtle); font-size: 12px; margin-top: 48px; }
    @media (max-width: 640px) {
      .search { flex-direction: column; }
      .btn { width: 100%; }
      .btn.sm { width: auto; }
    }
  </style>
</head>

  <script>
    window.TOPICS = [{"id":"mathematics","title":"Mathematics","field":"mathematics","wikiTitle":"Mathematics","aliases":["math","maths"],"x":180,"y":430,"overview":"Mathematics studies pattern, quantity, structure, and change using precise language. It is both a toolkit for the sciences and a field of inquiry in its own right.","whyItMatters":"Almost every deep explanation in physics, computing, and data depends on mathematical structure. Seeing mathematics as a landscape — not a pile of procedures — is how later subjects become readable.","prerequisites":["set-theory"],"coreConcepts":[{"name":"Proof","summary":"A chain of valid steps that establishes a claim from agreed assumptions."},{"name":"Abstraction","summary":"Keeping only the relations that matter and discarding accidental detail."},{"name":"Structure","summary":"Sets with operations and axioms: groups, spaces, graphs, measures."}],"related":["calculus","linear-algebra","probability","set-theory","geometry"],"goingDeeper":["number-theory","information-theory"],"applications":["Modeling physical laws","Cryptography","Machine learning","Engineering design"],"check":{"prompt":"What does a mathematical proof actually do?","choices":["It lists examples until a pattern looks likely.","It shows a claim follows from agreed assumptions by valid steps.","It replaces experiment in every science.","It is a formula that computes a number."],"answer":1,"explanation":"A proof is a reasoned argument from axioms and prior theorems, not a collection of examples. Examples can motivate; they do not by themselves establish generality."},"depths":{"intro":"Mathematics is the study of precise structures and the relations inside them.","understanding":"Definitions, theorems, and proofs are the working cycle: name an object, discover what must follow, and record why.","connections":"Calculus, linear algebra, and probability are different windows onto the same landscape of structure.","application":"Sciences borrow mathematical models when they need statements that can be checked for consistency and consequence.","advanced":"Modern research often lives in category theory, analysis, algebra, and geometry as overlapping languages rather than separate subjects."}},{"id":"calculus","title":"Calculus","field":"mathematics","wikiTitle":"Calculus","aliases":["derivatives","integrals","differential calculus"],"x":280,"y":340,"overview":"Calculus is the mathematics of change and accumulation. Differentiation measures instantaneous rates; integration adds continuously varying quantities.","whyItMatters":"Motion, growth, fields, and optimization are written in derivatives and integrals. Without calculus, classical physics and much of engineering remain qualitative.","prerequisites":["mathematics","geometry"],"coreConcepts":[{"name":"Limit","summary":"The value a quantity approaches as an input gets arbitrarily close to a point."},{"name":"Derivative","summary":"The instantaneous rate of change of a function."},{"name":"Integral","summary":"The accumulation of a quantity, often visualized as signed area."},{"name":"Fundamental theorem","summary":"Differentiation and integration are inverse processes."}],"related":["linear-algebra","newtonian-mechanics","probability","classical-physics"],"goingDeeper":["relativity","quantum-mechanics"],"applications":["Newtonian mechanics","Population models","Signal processing","Optimization"],"check":{"prompt":"The derivative of a function at a point is best described as:","choices":["The average of all values of the function.","The instantaneous rate of change at that point.","The total area under the graph.","A proof that the function is continuous."],"answer":1,"explanation":"The derivative is the limit of difference quotients — the slope of the tangent, not the area (that is the integral) and not an average of values."},"depths":{"intro":"Calculus asks how things change from moment to moment and how those changes add up.","understanding":"Limits make 'instantaneous' precise. Derivatives capture rates; integrals capture totals.","connections":"Mechanics writes force and motion in derivatives. Probability density is integrated to get chance.","application":"Engineers use calculus to design trajectories, circuits, and control systems.","advanced":"Analysis generalizes calculus to infinite-dimensional spaces and more subtle notions of limit."}},{"id":"linear-algebra","title":"Linear Algebra","field":"mathematics","wikiTitle":"Linear algebra","aliases":["matrices","vectors","vector spaces"],"x":300,"y":500,"overview":"Linear algebra studies vector spaces and linear maps. Matrices, eigenvalues, and inner products are the everyday language of high-dimensional structure.","whyItMatters":"Quantum mechanics, graphics, data, and machine learning all live in vector spaces. Linear algebra is the grammar those fields share.","prerequisites":["mathematics"],"coreConcepts":[{"name":"Vector space","summary":"A set closed under addition and scalar multiplication."},{"name":"Linear map","summary":"A transformation that preserves addition and scaling."},{"name":"Eigenvector","summary":"A direction a linear map stretches without rotating."},{"name":"Inner product","summary":"A way to measure angles and lengths in a space."}],"related":["calculus","quantum-mechanics","probability","computer-science"],"goingDeeper":["quantum-information","algorithms"],"applications":["Quantum states","Computer graphics","Least-squares fitting","Neural networks"],"check":{"prompt":"An eigenvector of a linear map is:","choices":["Any vector of length one.","A direction the map stretches or shrinks without changing its line.","The determinant of a matrix.","A vector that cannot be written as a combination of others."],"answer":1,"explanation":"Av = λv means the output stays on the same line through the origin. That geometric fact is more important than any particular matrix layout."},"depths":{"intro":"Linear algebra is the study of straight-line transformations in spaces of any dimension.","understanding":"Bases, matrices, rank, and spectra describe how linear maps act.","connections":"Quantum states are vectors; observables are linear operators. Data tables are matrices.","application":"From page rank to 3D rendering, linear maps do the work.","advanced":"Functional analysis and representation theory extend the same ideas far beyond finite matrices."}},{"id":"probability","title":"Probability","field":"mathematics","wikiTitle":"Probability theory","aliases":["chance","randomness","probability theory"],"x":210,"y":600,"overview":"Probability is the mathematics of uncertainty. It assigns numbers to events in a way that respects how those events combine.","whyItMatters":"Quantum mechanics, statistics, learning, and risk all require a disciplined language for 'how likely'. Informal hunches about chance are often wrong.","prerequisites":["mathematics","set-theory"],"coreConcepts":[{"name":"Sample space","summary":"The set of possible outcomes of a process."},{"name":"Random variable","summary":"A numerical quantity whose value depends on chance."},{"name":"Conditional probability","summary":"How a probability updates given new information."},{"name":"Expectation","summary":"The probability-weighted average of a random variable."}],"related":["statistics","quantum-mechanics","information-theory","calculus"],"goingDeeper":["quantum-information","evolution"],"applications":["Inference from data","Quantum amplitudes (related, not identical)","Insurance and risk","Randomized algorithms"],"check":{"prompt":"Conditional probability P(A|B) answers which question?","choices":["How often A happens in the long run, ignoring B.","How the chance of A changes once B is known to have occurred.","Whether A causes B.","The average of A and B."],"answer":1,"explanation":"P(A|B) is the probability of A given that B happened. It is not a claim about causation, and it is not the same as P(B|A)."},"depths":{"intro":"Probability gives a precise way to talk about uncertain events.","understanding":"Kolmogorov’s axioms, random variables, and conditioning are the core machinery.","connections":"Statistics uses probability to learn from data. Information theory measures surprise.","application":"Models of noise, genetics, markets, and algorithms all use probability.","advanced":"Measure-theoretic probability and stochastic processes underpin modern theory."}},{"id":"statistics","title":"Statistics","field":"mathematics","wikiTitle":"Statistics","aliases":["data analysis","inference"],"x":140,"y":700,"overview":"Statistics is the practice of learning about the world from incomplete, noisy data, using probability as the underlying language.","whyItMatters":"Claims about experiments, polls, and models stand or fall on statistical reasoning. Confusing sample with population is a common path to false certainty.","prerequisites":["probability"],"coreConcepts":[{"name":"Estimation","summary":"Using data to guess an unknown quantity, with uncertainty attached."},{"name":"Hypothesis test","summary":"A structured way to ask whether data are surprising under a model."},{"name":"Bias and variance","summary":"Two different ways an estimate can be wrong."}],"related":["probability","evolution","computer-science"],"goingDeeper":["information-theory"],"applications":["Clinical trials","A/B tests","Census inference","Machine learning evaluation"],"check":{"prompt":"Why is a sample not automatically the same as a population?","choices":["Because samples are always smaller, they cannot contain information.","Sampling introduces variability and possible bias, so conclusions need uncertainty.","Populations are theoretical and never exist.","Statistics forbids talking about populations."],"answer":1,"explanation":"Samples can be informative, but they are noisy and can be skewed. Statistics exists to quantify that gap rather than ignore it."},"depths":{"intro":"Statistics turns data into claims that include how sure we should be.","understanding":"Estimators, tests, and models are tools, not verdicts.","connections":"Probability is the theory; statistics is the applied conversation with data.","application":"Every empirical science eventually argues statistically.","advanced":"Causal inference and nonparametric methods go beyond textbook tests."}},{"id":"geometry","title":"Geometry","field":"mathematics","wikiTitle":"Geometry","aliases":["shapes","euclidean geometry"],"x":120,"y":330,"overview":"Geometry studies space: points, distances, angles, curvature, and the transformations that preserve them.","whyItMatters":"Physical space, maps, art, and relativity all rest on geometric ideas. Euclid is only the first chapter.","prerequisites":["mathematics"],"coreConcepts":[{"name":"Metric","summary":"A rule that says how far apart two points are."},{"name":"Symmetry","summary":"A transformation that leaves a structure looking the same."},{"name":"Curvature","summary":"How a space bends compared with flat Euclidean space."}],"related":["calculus","relativity","art"],"goingDeeper":["linear-algebra"],"applications":["General relativity","Computer-aided design","Navigation","Computer vision"],"check":{"prompt":"Euclidean geometry is the special case where:","choices":["Space is curved like a sphere.","Distances and angles behave as on a flat plane (or ordinary 3D space).","Time is included as a fourth dimension.","Only integers are allowed as lengths."],"answer":1,"explanation":"Euclid’s postulates describe flat space. Other geometries relax those postulates and appear in relativity and elsewhere."},"depths":{"intro":"Geometry is the mathematics of shape and space.","understanding":"Axioms define a space; theorems describe what must follow.","connections":"Calculus on curved spaces becomes differential geometry — the language of gravity.","application":"Maps, robotics, and graphics are geometric engineering.","advanced":"Riemannian geometry and topology generalize the idea of space itself."}},{"id":"set-theory","title":"Set Theory","field":"mathematics","wikiTitle":"Set theory","aliases":["sets","foundations of mathematics"],"x":90,"y":500,"overview":"Set theory is a foundation for much of modern mathematics: objects are collected into sets, and relations are defined from membership.","whyItMatters":"When you hear 'function', 'space', or 'probability measure', those words are usually built from sets. Foundations make later definitions less mysterious.","prerequisites":[],"coreConcepts":[{"name":"Set","summary":"A collection of objects treated as a single thing."},{"name":"Function","summary":"A rule assigning to each input exactly one output, as a set of pairs."},{"name":"Cardinality","summary":"A precise notion of size, including infinite sizes."}],"related":["mathematics","probability","computer-science"],"goingDeeper":["number-theory"],"applications":["Formalizing analysis","Database theory","Type systems (related)"],"check":{"prompt":"In set-theoretic language, a function is typically:","choices":["A machine that prints numbers.","A set of ordered pairs with unique first components.","A graph drawn on paper.","An algorithm that must halt."],"answer":1,"explanation":"The set of pairs (x, f(x)) is the function as a mathematical object. Algorithms are a different, computational idea."},"depths":{"intro":"Sets are collections; most mathematical objects can be built from them.","understanding":"Membership, unions, functions, and relations are the basic grammar.","connections":"Probability starts with a set of outcomes. Computing starts with discrete structures.","application":"Foundations rarely appear on the job, but they prevent category mistakes later.","advanced":"Axiomatic set theory (ZFC) and alternatives like type theory are research fields of their own."}},{"id":"number-theory","title":"Number Theory","field":"mathematics","wikiTitle":"Number theory","aliases":["primes","integers"],"x":80,"y":220,"overview":"Number theory studies the integers and their deep hidden structure: primes, congruences, and Diophantine equations.","whyItMatters":"Public-key cryptography rests on number-theoretic hardness. The subject also shows how 'simple' objects can hide enormous depth.","prerequisites":["mathematics"],"coreConcepts":[{"name":"Prime","summary":"An integer greater than 1 whose only positive divisors are 1 and itself."},{"name":"Modular arithmetic","summary":"Arithmetic of remainders, as on a clock."},{"name":"Congruence","summary":"Two integers leave the same remainder when divided by a modulus."}],"related":["mathematics","computer-science","cryptography"],"goingDeeper":["algorithms"],"applications":["RSA and related cryptosystems","Checksums","Random number generation"],"check":{"prompt":"Why do primes matter for much of public-key cryptography?","choices":["Because they are the only even numbers.","Because some schemes rely on the difficulty of factoring large integers built from primes.","Because primes cannot be multiplied.","Because computers can only store primes."],"answer":1,"explanation":"Factoring a product of large primes is believed hard, which is the security assumption behind RSA-style systems. Other cryptosystems use other hard problems."},"depths":{"intro":"Number theory is the study of whole numbers and their hidden patterns.","understanding":"Divisibility, primes, and modular arithmetic are the first tools.","connections":"Computing turned 'pure' number theory into infrastructure for secrecy.","application":"Cryptography, hashing, and coding theory borrow number-theoretic ideas.","advanced":"Algebraic number theory and arithmetic geometry go far beyond elementary primes."}},{"id":"physics","title":"Physics","field":"physics","wikiTitle":"Physics","aliases":["physical science"],"x":560,"y":430,"overview":"Physics seeks laws that describe matter, energy, space, and time, and tests those laws against experiment.","whyItMatters":"It is the most successful quantitative account of the inanimate world we have, and the parent of much of modern technology.","prerequisites":["mathematics","calculus"],"coreConcepts":[{"name":"Law","summary":"A compact rule that predicts observations within a domain."},{"name":"Conservation","summary":"Quantities that stay constant because of symmetries."},{"name":"Field","summary":"A physical quantity defined at every point in space and time."}],"related":["classical-physics","quantum-mechanics","relativity","thermodynamics"],"goingDeeper":["particle-physics","astronomy"],"applications":["Engineering","Electronics","Energy systems","Medical imaging"],"check":{"prompt":"A physical law is best thought of as:","choices":["A rule that can never be revised.","A compact, tested description that predicts observations in a domain.","A moral principle.","Any equation written in a textbook."],"answer":1,"explanation":"Laws are empirical and domain-limited. Newtonian mechanics remains excellent for ordinary speeds even though relativity replaced it as the deeper account."},"depths":{"intro":"Physics looks for quantitative laws of nature and checks them with experiment.","understanding":"Models, symmetries, and measurement sit at the center of the method.","connections":"Chemistry, astronomy, and engineering inherit physical laws at different scales.","application":"Every electrical device is applied electromagnetism; every engine is thermodynamics.","advanced":"Unification of quantum theory and gravity remains an open frontier."}},{"id":"classical-physics","title":"Classical Physics","field":"physics","wikiTitle":"Classical physics","aliases":["classical mechanics overview"],"x":470,"y":330,"overview":"Classical physics covers mechanics, thermodynamics, and electromagnetism as they were understood before quantum theory and relativity became necessary.","whyItMatters":"It is the correct effective theory for ordinary sizes, speeds, and temperatures — and the prerequisite for seeing why quantum mechanics was forced on us.","prerequisites":["calculus","newtonian-mechanics"],"coreConcepts":[{"name":"Trajectory","summary":"A definite path of a body through space as time passes."},{"name":"Field equations","summary":"Laws (like Maxwell’s) that say how fields evolve."},{"name":"Determinism","summary":"In the ideal classical picture, complete state plus laws fix the future."}],"related":["newtonian-mechanics","electromagnetism","thermodynamics","quantum-mechanics"],"goingDeeper":["relativity"],"applications":["Machinery","Acoustics","Circuit design at everyday scales"],"check":{"prompt":"Classical physics failed as a complete account primarily because:","choices":["It could not describe falling objects.","Experiments at high speed, strong gravity, and atomic scale contradicted it.","It used too much mathematics.","It ignored energy conservation."],"answer":1,"explanation":"Newton works extremely well in daily life. Relativity and quantum theory were demanded by precise experiments outside that domain."},"depths":{"intro":"Classical physics is the pre-quantum, pre-relativistic description of the world.","understanding":"Particles have positions and momenta; fields fill space; energy is conserved.","connections":"Quantum theory keeps classical physics as an approximation, not as a discarded myth.","application":"Bridges, engines, and most electrical engineering still live here.","advanced":"Classical field theory and Hamiltonian mechanics are the mature form of the subject."}},{"id":"newtonian-mechanics","title":"Newtonian Mechanics","field":"physics","wikiTitle":"Newton's laws of motion","aliases":["newton","classical mechanics","force and motion"],"x":430,"y":220,"overview":"Newtonian mechanics describes motion using mass, force, and acceleration. Newton’s laws plus gravitation explain falling, orbits, and much of ordinary machinery.","whyItMatters":"It is the first great quantitative theory of motion and the conceptual floor for later physics. You cannot see what quantum mechanics changed until you know this picture well.","prerequisites":["calculus"],"coreConcepts":[{"name":"Inertia","summary":"A body keeps its velocity unless a net force acts."},{"name":"F = ma","summary":"Net force equals mass times acceleration (in an inertial frame)."},{"name":"Action and reaction","summary":"Forces between two bodies come in equal-and-opposite pairs."},{"name":"Universal gravitation","summary":"Masses attract with a force that falls as 1/r²."}],"related":["classical-physics","calculus","gravity","astronomy"],"goingDeeper":["relativity","thermodynamics"],"applications":["Orbital mechanics","Vehicle dynamics","Structural loads"],"check":{"prompt":"If no net force acts on a body, Newtonian mechanics says it will:","choices":["Slow down and stop.","Move with constant velocity (including remaining at rest).","Follow a circular path.","Fall toward the nearest mass."],"answer":1,"explanation":"The first law is about inertia: constant velocity, not 'coming to rest'. Friction is a force, which is why everyday objects stop."},"depths":{"intro":"Newton’s laws relate force to the way motion changes.","understanding":"Acceleration, not velocity, is what force produces. Gravity is one particular force.","connections":"Calculus is the language of these laws. Orbits are mechanics plus gravitation.","application":"From cranes to spacecraft, engineers still integrate Newton’s equations.","advanced":"Lagrangian and Hamiltonian formulations reveal symmetries that Newton’s original statement hides."}},{"id":"gravity","title":"Gravity","field":"physics","wikiTitle":"Gravity","aliases":["gravitation","gravitational force"],"x":540,"y":150,"overview":"Gravity is the interaction that makes masses attract. Newton described it as a force; Einstein described it as spacetime curvature.","whyItMatters":"It holds planets in orbit, shapes stars, and — in the relativistic picture — tells light how to travel. Black holes are gravity taken to an extreme.","prerequisites":["newtonian-mechanics"],"coreConcepts":[{"name":"Inverse-square force","summary":"Newtonian gravity weakens with the square of distance."},{"name":"Equivalence principle","summary":"Uniform acceleration and a uniform gravitational field feel the same locally."},{"name":"Spacetime curvature","summary":"In general relativity, mass-energy tells spacetime how to bend."}],"related":["relativity","black-holes","newtonian-mechanics","astronomy"],"goingDeeper":["cosmology"],"applications":["Satellite orbits","Tides","Gravitational lensing","GPS relativistic corrections"],"check":{"prompt":"In general relativity, gravity is primarily described as:","choices":["A fluid that fills space.","The curvature of spacetime produced by mass-energy.","A magnetic effect of rotating planets.","An inverse-cube electrostatic force."],"answer":1,"explanation":"Einstein’s theory replaces the force-at-a-distance picture with geometry. Newton’s inverse-square law remains an excellent approximation in weak fields."},"depths":{"intro":"Gravity is why things fall and why planets orbit.","understanding":"Newton gives a force law; Einstein gives a geometric law.","connections":"Black holes, cosmology, and GPS all sit on this thread.","application":"Mission design still uses Newton, with relativistic patches where needed.","advanced":"Gravitational waves and numerical relativity are the modern observational frontier."}},{"id":"electromagnetism","title":"Electromagnetism","field":"physics","wikiTitle":"Electromagnetism","aliases":["maxwell","electricity and magnetism"],"x":640,"y":300,"overview":"Electromagnetism unifies electric and magnetic fields. Maxwell’s equations plus the Lorentz force describe light, circuits, and most of everyday technology.","whyItMatters":"Light is an electromagnetic wave. Radio, computing hardware, and chemistry’s bonds all rest on this theory.","prerequisites":["classical-physics","calculus"],"coreConcepts":[{"name":"Electric field","summary":"The influence that electric charge exerts through space."},{"name":"Magnetic field","summary":"The influence associated with moving charge and magnetic materials."},{"name":"Maxwell’s equations","summary":"Four laws that govern how the fields are generated and how they change."},{"name":"Electromagnetic wave","summary":"A self-sustaining oscillation of E and B that travels at the speed of light."}],"related":["classical-physics","spectroscopy","relativity"],"goingDeeper":["quantum-mechanics","nuclear-fusion"],"applications":["Electric power","Wireless communication","Optics","Electronic devices"],"check":{"prompt":"Maxwell’s theory showed that light is:","choices":["A stream of sound through the aether.","An electromagnetic wave traveling at a characteristic speed.","A gravitational ripple.","A purely mechanical vibration of air."],"answer":1,"explanation":"The wave speed predicted by Maxwell’s equations matches the measured speed of light — one of the great unifications in physics."},"depths":{"intro":"Electricity and magnetism are two faces of one field theory.","understanding":"Charges make fields; changing fields make each other; waves result.","connections":"Special relativity grew from the clash between Maxwell and Newton.","application":"Every motor, antenna, and chip is applied electromagnetism.","advanced":"Quantum electrodynamics is the quantum-field upgrade of this theory."}},{"id":"thermodynamics","title":"Thermodynamics","field":"physics","wikiTitle":"Thermodynamics","aliases":["heat","entropy","statistical mechanics intro"],"x":620,"y":540,"overview":"Thermodynamics studies energy, heat, work, and entropy. It constrains what engines, living systems, and the universe can do.","whyItMatters":"You cannot understand stars, engines, or the arrow of time without it. Entropy is not a vague metaphor; it is a physical quantity.","prerequisites":["classical-physics"],"coreConcepts":[{"name":"Energy conservation","summary":"The first law: energy is accounted for, not created or destroyed."},{"name":"Entropy","summary":"A measure of how many microscopic arrangements look the same macroscopically."},{"name":"Second law","summary":"Entropy of an isolated system does not decrease."}],"related":["nuclear-fusion","stars","information-theory","biology"],"goingDeeper":["stellar-evolution"],"applications":["Heat engines","Refrigeration","Climate energy budgets","Chemistry"],"check":{"prompt":"The second law of thermodynamics says that for an isolated system:","choices":["Energy increases forever.","Entropy does not decrease.","Temperature is always uniform.","No work can ever be done."],"answer":1,"explanation":"Energy is conserved (first law). Entropy of an isolated system tends not to decrease (second law). That is why heat engines have limits."},"depths":{"intro":"Thermodynamics is the science of heat, work, and the direction of physical processes.","understanding":"The laws are constraints. Statistical mechanics explains them from molecules.","connections":"Stars shine because fusion and radiation obey these constraints.","application":"Power plants and metabolism are thermodynamic machines.","advanced":"Non-equilibrium thermodynamics describes living and driven systems."}},{"id":"relativity","title":"Relativity","field":"physics","wikiTitle":"Theory of relativity","aliases":["einstein","special relativity","general relativity"],"x":730,"y":200,"overview":"Relativity is Einstein’s reconstruction of space and time. Special relativity deals with inertial motion and light; general relativity includes gravity as geometry.","whyItMatters":"It replaced Newton’s absolute space and time, predicted black holes and gravitational waves, and is required for GPS-level precision.","prerequisites":["newtonian-mechanics","electromagnetism","geometry"],"coreConcepts":[{"name":"Invariant speed of light","summary":"All inertial observers measure the same speed of light."},{"name":"Spacetime","summary":"Space and time form one four-dimensional structure."},{"name":"Mass-energy","summary":"E = mc²: mass is a form of energy."},{"name":"Curved spacetime","summary":"Mass-energy curves geometry; geometry guides motion."}],"related":["gravity","black-holes","cosmology","nuclear-fusion"],"goingDeeper":["particle-physics"],"applications":["GPS","Particle accelerators","Astrophysics of compact objects"],"check":{"prompt":"Special relativity’s central experimental fact is that:","choices":["Nothing can ever move.","The speed of light in vacuum is the same for all inertial observers.","Gravity is a force that acts instantly.","Mass is always conserved separately from energy."],"answer":1,"explanation":"The invariance of c forces a revision of how time and space mix. Mass-energy equivalence follows from that structure."},"depths":{"intro":"Relativity is a theory of space, time, and gravity — not a slogan that 'everything is relative'.","understanding":"Inertial frames share c; gravity is geometry in the general theory.","connections":"Black holes and Big Bang cosmology are general-relativistic objects.","application":"Accelerators and satellite navigation need these corrections.","advanced":"Solutions of Einstein’s equations and quantum field theory on curved spacetime are advanced terrain."}},{"id":"quantum-mechanics","title":"Quantum Mechanics","field":"physics","wikiTitle":"Quantum mechanics","aliases":["quantum physics","qm","wavefunction"],"x":760,"y":420,"overview":"Quantum mechanics is the framework for atomic and subatomic physics. States are vectors; observables are operators; measurement outcomes are probabilistic.","whyItMatters":"It explains atoms, chemistry, lasers, and semiconductors. It is also the starting point for quantum information and any serious discussion of the microscopic world.","prerequisites":["classical-physics","linear-algebra","probability","calculus"],"coreConcepts":[{"name":"State vector","summary":"A complete description of a quantum system, living in a Hilbert space."},{"name":"Superposition","summary":"A state can be a linear combination of classically distinct possibilities."},{"name":"Measurement","summary":"Yields an eigenvalue with probabilities given by the state; the state then updates."},{"name":"Uncertainty","summary":"Some pairs of observables cannot be sharp together."}],"related":["quantum-information","quantum-computing","spectroscopy","particle-physics"],"goingDeeper":["nuclear-fusion","consciousness"],"applications":["Transistors and lasers","MRI","Atomic clocks","Quantum technologies"],"check":{"prompt":"In standard quantum mechanics, the wavefunction is used to:","choices":["Give a definite trajectory for every particle at all times, as in Newton.","Compute probabilities for measurement outcomes from a state in Hilbert space.","Prove that hidden variables are impossible in every interpretation.","Replace linear algebra with arithmetic of integers."],"answer":1,"explanation":"The Born rule turns the state into probabilities. Trajectories in the Newtonian sense are not part of the standard formalism, and interpretation remains debated."},"depths":{"intro":"Quantum mechanics replaced definite trajectories with states and probabilities at small scales.","understanding":"Linear algebra + probability + a dynamical law (Schrödinger) is the skeleton.","connections":"It needs calculus, linear algebra, and probability as prerequisites, then feeds chemistry and computing.","application":"Modern electronics is quantum mechanics engineered into solids.","advanced":"Quantum field theory extends the idea to fields and particle creation."}},{"id":"quantum-information","title":"Quantum Information","field":"physics","wikiTitle":"Quantum information","aliases":["qubits","entanglement theory"],"x":880,"y":500,"overview":"Quantum information studies information carried by quantum systems: qubits, entanglement, and the limits of what can be copied or known.","whyItMatters":"It sits between physics and computer science. Entanglement is a resource, not a slogan, and it reshapes what 'information' can mean.","prerequisites":["quantum-mechanics","linear-algebra","information-theory"],"coreConcepts":[{"name":"Qubit","summary":"A two-level quantum system used as the unit of quantum information."},{"name":"Entanglement","summary":"A joint state that cannot be written as a product of individual states."},{"name":"No-cloning","summary":"Unknown quantum states cannot be perfectly copied."}],"related":["quantum-computing","information-theory","quantum-mechanics"],"goingDeeper":["cryptography"],"applications":["Quantum cryptography","Quantum sensing","Foundations of computing"],"check":{"prompt":"Entanglement means that:","choices":["Two particles are glued together in space.","The joint state cannot be factored into independent states of the parts.","Information travels faster than light.","Measurement is forbidden."],"answer":1,"explanation":"Entanglement is a property of the joint state. It does not allow controllable faster-than-light signaling."},"depths":{"intro":"Quantum information is information stored in quantum states rather than ordinary bits.","understanding":"Qubits, channels, and entanglement measures are the vocabulary.","connections":"It borrows from information theory and feeds quantum computing.","application":"Quantum key distribution is the most mature application.","advanced":"Resource theories and many-body entanglement are active research."}},{"id":"quantum-computing","title":"Quantum Computing","field":"computing","wikiTitle":"Quantum computing","aliases":["quantum computer","shor","grover"],"x":980,"y":430,"overview":"Quantum computing is computation that uses quantum states and operations. For some problems it offers asymptotic speedups; it is not a faster laptop for everything.","whyItMatters":"It connects physics to algorithms and cryptography. Understanding it requires resisting both hype and dismissiveness.","prerequisites":["quantum-information","algorithms","linear-algebra"],"coreConcepts":[{"name":"Gate model","summary":"Computation as a sequence of unitary operations plus measurement."},{"name":"Interference","summary":"Amplitudes add; algorithms aim to reinforce right answers."},{"name":"Complexity","summary":"Which problems become easier, and by how much, is a precise question."}],"related":["quantum-mechanics","computer-science","cryptography"],"goingDeeper":["particle-physics"],"applications":["Factoring (Shor) in theory","Quantum simulation","Optimization research"],"check":{"prompt":"A fair statement about quantum computers is that they:","choices":["Make every program exponentially faster.","Exploit quantum states to outperform classical machines on some structured problems.","Have already replaced all classical cryptography in practice.","Do not need error correction because quantum states are stable."],"answer":1,"explanation":"Speedups are problem-specific. Noise and error correction are central engineering challenges. Classical crypto is not obsolete today."},"depths":{"intro":"A quantum computer processes information in quantum states.","understanding":"Algorithms manipulate amplitudes so that measurement is likely to yield a useful answer.","connections":"Without linear algebra and quantum mechanics, the model is opaque.","application":"Simulation of quantum systems is the most natural near-term use.","advanced":"Fault tolerance, complexity classes (BQP), and hardware architectures."}},{"id":"particle-physics","title":"Particle Physics","field":"physics","wikiTitle":"Particle physics","aliases":["standard model","high energy physics"],"x":860,"y":300,"overview":"Particle physics studies the elementary constituents of matter and their interactions, organized today in the Standard Model.","whyItMatters":"It explains why chemistry has the elements it has, and it connects laboratory accelerators to the early universe.","prerequisites":["quantum-mechanics","relativity"],"coreConcepts":[{"name":"Fermions and bosons","summary":"Matter particles versus force-carrying particles, distinguished by spin."},{"name":"Standard Model","summary":"The tested quantum field theory of electromagnetic, weak, and strong forces."},{"name":"Symmetry breaking","summary":"How the Higgs field gives mass to some particles."}],"related":["quantum-mechanics","nuclear-fusion","cosmology"],"goingDeeper":["astronomy"],"applications":["Medical accelerators","Detector technology","Early-universe cosmology"],"check":{"prompt":"The Standard Model is:","choices":["A complete theory of gravity and quantum mechanics together.","A highly tested theory of known particles and three of the four forces, not including a full quantum gravity.","A model of the solar system.","A statistical model of experimental error only."],"answer":1,"explanation":"The Standard Model is extraordinarily successful and still incomplete: it does not include dark matter or a quantum theory of gravity."},"depths":{"intro":"Particle physics asks what matter is made of at the smallest accessible scales.","understanding":"Quantum fields, symmetries, and collider experiments are the method.","connections":"Nuclear fusion in stars is particle and nuclear physics in a gravitational engine.","application":"Accelerator technology spilled into medicine and materials.","advanced":"Beyond-Standard-Model physics is driven by puzzles like neutrino mass and dark matter."}},{"id":"astronomy","title":"Astronomy","field":"astronomy","wikiTitle":"Astronomy","aliases":["space science","the universe"],"x":1080,"y":200,"overview":"Astronomy is the scientific study of objects and phenomena beyond Earth: planets, stars, galaxies, and the large-scale universe.","whyItMatters":"It places human history on a cosmic timeline and is a laboratory for physics under conditions we cannot build on Earth.","prerequisites":["physics","geometry"],"coreConcepts":[{"name":"Celestial object","summary":"A naturally occurring body or structure beyond Earth’s atmosphere."},{"name":"Distance ladder","summary":"Interlocking methods that turn apparent brightness and geometry into distance."},{"name":"Spectrum","summary":"Light spread by wavelength — the main messenger from the sky."}],"related":["stars","galaxies","cosmology","spectroscopy"],"goingDeeper":["black-holes","planet-formation"],"applications":["Satellite navigation heritage","Timekeeping","Planetary defense","Inspiration for physics"],"check":{"prompt":"Most of what astronomers know about distant objects comes from:","choices":["Directly visiting them with spacecraft.","Analyzing electromagnetic radiation (and now also messengers like neutrinos and gravitational waves).","Ancient star catalogs alone.","Computer games."],"answer":1,"explanation":"Light (and other messengers) is the data. Spectroscopy and imaging turn that radiation into physical knowledge."},"depths":{"intro":"Astronomy studies the universe beyond Earth using observation and physics.","understanding":"Telescopes plus physical models convert photons into distances, masses, and histories.","connections":"It sits on physics and feeds cosmology and planetary science.","application":"The same detectors and optics show up in medicine and industry.","advanced":"Multi-messenger astronomy combines light, gravitational waves, and particles."}},{"id":"stars","title":"Stars","field":"astronomy","wikiTitle":"Star","aliases":["star","sun-like stars"],"x":1180,"y":280,"overview":"Stars are self-gravitating balls of plasma powered, for most of their lives, by nuclear fusion in their cores.","whyItMatters":"Every heavy element in your body was made in stars or in their deaths. Stellar physics is chemistry’s cosmic origin story.","prerequisites":["astronomy","nuclear-fusion","gravity"],"coreConcepts":[{"name":"Hydrostatic equilibrium","summary":"Gravity inward balanced by pressure outward."},{"name":"Main sequence","summary":"The long hydrogen-fusing stage of a star’s life."},{"name":"Mass as destiny","summary":"A star’s mass largely sets its lifetime and death."}],"related":["stellar-evolution","nuclear-fusion","spectroscopy","supernovae"],"goingDeeper":["black-holes","heavy-elements"],"applications":["Solar energy context","Stellar ages for galactic history","Habitability of planetary systems"],"check":{"prompt":"What primarily powers a main-sequence star like the Sun?","choices":["Chemical burning of coal-like fuel.","Nuclear fusion of hydrogen into helium in the core.","Gravitational collapse alone, with no nuclear reactions.","Electric currents from nearby planets."],"answer":1,"explanation":"Core hydrogen fusion supplies the Sun’s luminosity for billions of years. Collapse heating matters in formation and in some later stages."},"depths":{"intro":"A star is a glowing ball of plasma held up by its own pressure against gravity.","understanding":"Fusion in the core, energy transport, and the surface spectrum define the object.","connections":"Fusion, gravity, and thermodynamics meet here.","application":"Stellar models date star clusters and reconstruct galaxy history.","advanced":"Stellar interiors, magnetic activity, and binary evolution are specialist fields."}},{"id":"nuclear-fusion","title":"Nuclear Fusion","field":"physics","wikiTitle":"Nuclear fusion","aliases":["fusion","hydrogen burning"],"x":1080,"y":380,"overview":"Nuclear fusion is the joining of light nuclei into heavier ones, releasing energy when the products are more tightly bound.","whyItMatters":"It is why stars shine and why fusion energy on Earth is pursued. It also forges some of the elements.","prerequisites":["particle-physics","thermodynamics"],"coreConcepts":[{"name":"Binding energy","summary":"The energy associated with how tightly nucleons are bound."},{"name":"Coulomb barrier","summary":"Electrostatic repulsion that nuclei must overcome to fuse."},{"name":"Proton-proton chain","summary":"The dominant hydrogen-fusion sequence in Sun-like stars."}],"related":["stars","stellar-evolution","heavy-elements","thermodynamics"],"goingDeeper":["supernovae"],"applications":["Stellar energy","Experimental fusion reactors","Weapons physics (historical)"],"check":{"prompt":"Fusion releases energy when:","choices":["Any two nuclei touch, regardless of type.","The product nuclei are more tightly bound per nucleon than the fuel, so mass-energy is released.","Electrons fall into the nucleus.","Gravity is turned off."],"answer":1,"explanation":"The curve of binding energy explains why fusing light nuclei (and fission of very heavy ones) can yield energy."},"depths":{"intro":"Fusion is the nuclear process that powers stars.","understanding":"Nuclei must get close despite charge repulsion; quantum tunneling makes that possible in stars.","connections":"Relativity’s mass-energy equivalence accounts for the yield.","application":"Laboratory fusion tries to recreate stellar conditions with magnetic or inertial confinement.","advanced":"Nuclear reaction networks in stars are a computational and experimental specialty."}},{"id":"stellar-evolution","title":"Stellar Evolution","field":"astronomy","wikiTitle":"Stellar evolution","aliases":["life cycle of stars","star death"],"x":1220,"y":400,"overview":"Stellar evolution is the life story of a star: formation, long nuclear burning, and death as a white dwarf, neutron star, or black hole.","whyItMatters":"It explains why the night sky looks as it does and how the periodic table was stocked with elements heavier than helium.","prerequisites":["stars","nuclear-fusion"],"coreConcepts":[{"name":"Protostar","summary":"A collapsing cloud on its way to hydrogen fusion."},{"name":"Red giant","summary":"A later stage when the core contracts and the envelope expands."},{"name":"Remnant","summary":"What remains: white dwarf, neutron star, or black hole."}],"related":["supernovae","black-holes","heavy-elements","planet-formation"],"goingDeeper":["galaxies"],"applications":["Dating star clusters","Chemical evolution of galaxies","Source of neutron stars"],"check":{"prompt":"A star’s mass mainly determines:","choices":["Only its color, not its fate.","How long it lives and what remnant it can leave.","Whether gravity exists nearby.","The number of planets it must have."],"answer":1,"explanation":"Mass sets core temperature, lifetime, and whether the star can explode or collapse to a neutron star or black hole."},"depths":{"intro":"Stars are born, shine, and die in ways that depend mostly on mass.","understanding":"Nuclear stages shift as fuel is exhausted; structure adjusts.","connections":"Deaths seed the galaxy with heavy elements and compact objects.","application":"Hertzsprung–Russell diagrams are the observational map of these stages.","advanced":"Binary interaction can completely rewrite a single-star story."}},{"id":"supernovae","title":"Supernovae","field":"astronomy","wikiTitle":"Supernova","aliases":["supernova","exploding stars"],"x":1320,"y":330,"overview":"A supernova is a stellar explosion that can outshine a galaxy for weeks. Some types mark the death of massive stars; others are exploding white dwarfs.","whyItMatters":"They forge and fling heavy elements, produce neutron stars and black holes, and serve as distance beacons for cosmology.","prerequisites":["stellar-evolution"],"coreConcepts":[{"name":"Core collapse","summary":"The iron core of a massive star implodes and the envelope explodes."},{"name":"Type Ia","summary":"A thermonuclear explosion of a white dwarf, used as a standardizable candle."},{"name":"Nucleosynthesis","summary":"Rapid nuclear reactions that build heavy nuclei."}],"related":["heavy-elements","black-holes","cosmology","neutron-stars"],"goingDeeper":["galaxies"],"applications":["Measuring cosmic expansion","Origin of many elements","High-energy astrophysics"],"check":{"prompt":"Type Ia supernovae are especially useful in cosmology because they:","choices":["Are the only explosions in the universe.","Have luminosities that can be standardized, giving distances.","Always produce black holes.","Occur only in the Milky Way."],"answer":1,"explanation":"Their calibrated brightness lets astronomers measure distances across the universe, which revealed cosmic acceleration."},"depths":{"intro":"Supernovae are catastrophic stellar explosions.","understanding":"Different progenitors produce different explosions and remnants.","connections":"They link stellar death to galactic chemistry and cosmology.","application":"Distance measurements that discovered dark energy.","advanced":"Explosion hydrodynamics and neutrino transport are unsolved in detail."}},{"id":"heavy-elements","title":"Heavy Elements","field":"astronomy","wikiTitle":"Nucleosynthesis","aliases":["nucleosynthesis","origin of elements","metals in astronomy"],"x":1340,"y":460,"overview":"Elements heavier than helium are built in stars and explosions. Astronomers call them 'metals' even when they mean carbon or oxygen.","whyItMatters":"Planets, chemistry, and life require these nuclei. Their abundances are a fossil record of previous generations of stars.","prerequisites":["nuclear-fusion","supernovae"],"coreConcepts":[{"name":"Big Bang leftovers","summary":"Most hydrogen and helium were made in the first minutes."},{"name":"Stellar burning","summary":"Fusion in stars builds carbon, oxygen, and more."},{"name":"r-process","summary":"Rapid neutron capture in extreme events making the heaviest nuclei."}],"related":["stars","planet-formation","biology"],"goingDeeper":["spectroscopy"],"applications":["Planetary composition","Dating with radioactive nuclei","Galactic archaeology"],"check":{"prompt":"Most of the gold in the universe is thought to be made:","choices":["In the first three minutes after the Big Bang.","In extreme neutron-rich events such as some mergers or explosions, not in ordinary hydrogen burning.","By chemical reactions in planetary oceans.","Inside living cells."],"answer":1,"explanation":"Light elements are mostly primordial; many of the heaviest nuclei need rapid neutron capture in rare, violent sites."},"depths":{"intro":"The periodic table has a cosmic history.","understanding":"Different mass ranges and events contribute different elements.","connections":"Planet formation waits on this enrichment.","application":"Stellar spectra are used to read a galaxy’s chemical past.","advanced":"Which site dominates the r-process is still an active debate."}},{"id":"black-holes","title":"Black Holes","field":"astronomy","wikiTitle":"Black hole","aliases":["black hole","event horizon"],"x":1240,"y":140,"overview":"A black hole is a region of spacetime where gravity is so strong that nothing, including light, can escape from inside the event horizon.","whyItMatters":"They are laboratories for strong-field gravity, engines for some of the brightest objects in the universe, and a stress test for quantum theory.","prerequisites":["gravity","relativity","stars"],"coreConcepts":[{"name":"Event horizon","summary":"The boundary beyond which escape to infinity is impossible."},{"name":"Singularity","summary":"A region where classical general relativity predicts unbounded curvature."},{"name":"Accretion","summary":"Infalling gas that can radiate enormous energy before crossing the horizon."}],"related":["stellar-evolution","galaxies","quantum-mechanics","gravity"],"goingDeeper":["information-theory"],"applications":["Active galactic nuclei","Gravitational-wave sources","Tests of general relativity"],"check":{"prompt":"The event horizon of a black hole is:","choices":["A solid physical surface like a planet’s crust.","A boundary in spacetime from which light cannot escape to infinity.","The glowing disk of infalling matter itself.","A region of magnetic field only."],"answer":1,"explanation":"The horizon is geometric, not a hard surface. The glowing material people photograph is usually the accretion flow outside."},"depths":{"intro":"A black hole is gravity so intense that light cannot climb out from inside a horizon.","understanding":"Mass, spin, and charge (classically) characterize the exterior. Interiors are theoretically fraught.","connections":"Massive-star death and galactic centers produce them. Quantum theory raises the information puzzle.","application":"LIGO/Virgo detections are colliding black holes becoming one.","advanced":"Hawking radiation and the information paradox sit at the quantum-gravity frontier."}},{"id":"neutron-stars","title":"Neutron Stars","field":"astronomy","wikiTitle":"Neutron star","aliases":["pulsar","pulsars"],"x":1400,"y":240,"overview":"A neutron star is the collapsed core of a massive star, supported by neutron degeneracy pressure. Pulsars are neutron stars that sweep beams of radiation past Earth.","whyItMatters":"They are the densest matter we can observe directly and a source of gravitational waves when they merge.","prerequisites":["stellar-evolution","supernovae"],"coreConcepts":[{"name":"Degeneracy pressure","summary":"Quantum pressure that does not require heat."},{"name":"Pulsar","summary":"A spinning magnetized neutron star observed as pulses."}],"related":["black-holes","heavy-elements","particle-physics"],"goingDeeper":["gravity"],"applications":["Precision clocks in space","Tests of general relativity in binaries"],"check":{"prompt":"A pulsar is best described as:","choices":["A star that is turning into a planet.","A rotating, magnetized neutron star whose beam crosses our line of sight.","A black hole with a solid surface.","A type of comet."],"answer":1,"explanation":"Pulses are a lighthouse effect from a spinning neutron star, not the star turning on and off."},"depths":{"intro":"Neutron stars are city-sized remnants of massive stars, denser than atomic nuclei in bulk.","understanding":"Gravity vs quantum degeneracy sets the object. Magnetism plus spin makes pulsars.","connections":"Above a mass limit, even this support fails and a black hole results.","application":"Binary pulsars tested gravitational radiation before LIGO.","advanced":"The equation of state of dense matter is an open nuclear-physics problem."}},{"id":"galaxies","title":"Galaxies","field":"astronomy","wikiTitle":"Galaxy","aliases":["galaxy","milky way"],"x":1480,"y":360,"overview":"A galaxy is a vast system of stars, gas, dust, and dark matter, bound by gravity. The Milky Way is one of hundreds of billions.","whyItMatters":"Galaxies are where stars and planets form. Their clustering traces the large-scale structure of the universe.","prerequisites":["stars","gravity"],"coreConcepts":[{"name":"Spiral and elliptical","summary":"Broad morphological families with different star-formation histories."},{"name":"Dark matter halo","summary":"The unseen mass that dominates a galaxy’s gravity at large radius."},{"name":"Supermassive black hole","summary":"A massive black hole found in most large galaxy centers."}],"related":["black-holes","cosmology","planet-formation"],"goingDeeper":["spectroscopy"],"applications":["Mapping dark matter","Understanding our Galactic environment"],"check":{"prompt":"Rotation curves of spiral galaxies were surprising because they suggested:","choices":["Stars do not feel gravity.","There is more gravitating mass than the visible stars and gas account for.","Galaxies are smaller than the Solar System.","Light does not travel in straight lines at all."],"answer":1,"explanation":"Outer stars move too fast for the visible mass. That is a central argument for dark matter (or a modification of gravity)."},"depths":{"intro":"Galaxies are the cities of stars.","understanding":"Morphology, dynamics, and central black holes define types.","connections":"Cosmology is the story of how galaxies assembled.","application":"Surveys of galaxies map the universe in three dimensions.","advanced":"Galaxy formation simulations couple gravity, gas, and feedback from stars and black holes."}},{"id":"cosmology","title":"Cosmology","field":"astronomy","wikiTitle":"Physical cosmology","aliases":["big bang","universe history","expanding universe"],"x":1480,"y":180,"overview":"Physical cosmology is the study of the universe as a whole: its expansion, composition, and history from the hot Big Bang to the present.","whyItMatters":"It is the largest-scale application of gravity and particle physics, and it frames every other origin story.","prerequisites":["relativity","galaxies","particle-physics"],"coreConcepts":[{"name":"Expansion","summary":"Space between distant galaxies grows with time."},{"name":"Cosmic microwave background","summary":"The leftover radiation from when the universe became transparent."},{"name":"Dark energy","summary":"The name for whatever drives accelerating expansion."}],"related":["astronomy","gravity","supernovae"],"goingDeeper":["quantum-mechanics"],"applications":["Interpreting large surveys","Fundamental physics constraints"],"check":{"prompt":"The cosmic microwave background is evidence that:","choices":["The universe is empty.","The early universe was hot and dense and later became transparent.","Stars have always existed unchanged.","Galaxies do not move."],"answer":1,"explanation":"The CMB is leftover light from recombination, redshifted into microwaves — a fossil of a hot early phase."},"depths":{"intro":"Cosmology treats the universe as a single physical system with a history.","understanding":"Expansion, contents (matter, radiation, dark energy), and initial conditions.","connections":"Supernovae, particle physics, and general relativity all feed the model.","application":"Parameter estimation from telescopes is precision science.","advanced":"Inflation, dark matter identity, and the cosmological constant problem are open."}},{"id":"spectroscopy","title":"Spectroscopy","field":"astronomy","wikiTitle":"Spectroscopy","aliases":["spectrum","spectral lines"],"x":1120,"y":520,"overview":"Spectroscopy spreads light by wavelength. Emission and absorption lines are fingerprints of atoms, temperature, motion, and composition.","whyItMatters":"It is how we know what stars are made of, how fast galaxies recede, and how molecules in a lab are structured.","prerequisites":["electromagnetism","quantum-mechanics"],"coreConcepts":[{"name":"Spectral line","summary":"A sharp excess or deficit of light at a specific wavelength."},{"name":"Redshift","summary":"Lines shifted by expansion or motion along the line of sight."},{"name":"Blackbody","summary":"A thermal spectrum set by temperature."}],"related":["stars","quantum-mechanics","chemistry"],"goingDeeper":["galaxies"],"applications":["Chemical analysis","Astronomy","Medical diagnostics"],"check":{"prompt":"A dark absorption line in a star’s spectrum typically means:","choices":["The telescope is broken.","Atoms in the atmosphere absorbed photons at specific energies.","The star has no elements.","Light is a sound wave."],"answer":1,"explanation":"Atoms absorb discrete energies corresponding to quantum jumps. The pattern identifies the element."},"depths":{"intro":"A spectrum is light sorted by color — and it is packed with physical data.","understanding":"Quantum energy levels create lines; motion and expansion shift them.","connections":"Astronomy without spectroscopy would be mostly pretty pictures.","application":"Industry uses the same idea to identify materials.","advanced":"Radiative transfer in atmospheres is a full profession."}},{"id":"planet-formation","title":"Planet Formation","field":"astronomy","wikiTitle":"Nebular hypothesis","aliases":["planets","protoplanetary disk","solar system origin"],"x":1220,"y":600,"overview":"Planets grow in disks of gas and dust around young stars, from pebbles to worlds, in a process still being observed in other systems.","whyItMatters":"It explains why Earth exists, why some worlds are giants, and how common habitable planets might be.","prerequisites":["stars","gravity"],"coreConcepts":[{"name":"Protoplanetary disk","summary":"A rotating disk of leftover material around a newborn star."},{"name":"Accretion","summary":"Stickiness and gravity assembling larger bodies."},{"name":"Migration","summary":"Planets can move inward or outward through the disk."}],"related":["heavy-elements","biology","astronomy"],"goingDeeper":["evolution"],"applications":["Exoplanet demographics","Understanding Earth’s volatile budget"],"check":{"prompt":"Planets are understood to form primarily:","choices":["From debris captured from other galaxies in the present day.","In disks of gas and dust around young stars.","Inside the cores of dying stars.","By condensation of the cosmic microwave background."],"answer":1,"explanation":"Young stars are observed with disks; the nebular picture plus modern disk physics is the standard account."},"depths":{"intro":"Worlds assemble from leftover star-forming material.","understanding":"Dust to planetesimals to planets, plus gas accretion for giants.","connections":"Need heavy elements from earlier stars. Sets the stage for geology and life.","application":"Exoplanet surveys test formation theories.","advanced":"Pebble accretion and disk instabilities are competing detailed models."}},{"id":"biology","title":"Biology","field":"biology","wikiTitle":"Biology","aliases":["life science","life"],"x":430,"y":700,"overview":"Biology is the science of living systems: their structure, function, heredity, evolution, and interactions.","whyItMatters":"It is the science of ourselves and of every ecosystem we depend on. Medicine and agriculture are applied biology.","prerequisites":["chemistry","cells"],"coreConcepts":[{"name":"Organism","summary":"A living system capable of metabolism, maintenance, and (usually) reproduction."},{"name":"Evolution","summary":"Change in the inherited traits of populations across generations."},{"name":"Information","summary":"Genomes store and transmit heritable instructions."}],"related":["evolution","genetics","cells","ecology"],"goingDeeper":["neuroscience"],"applications":["Medicine","Agriculture","Conservation","Biotechnology"],"check":{"prompt":"Modern biology treats living things as:","choices":["Static types that never change.","Evolving physical systems that store hereditary information and transform energy.","Purely spiritual entities outside science.","Machines that do not use chemistry."],"answer":1,"explanation":"Metabolism, heredity, and evolution are the overlapping cores of the modern synthesis of biology."},"depths":{"intro":"Biology studies life as a natural phenomenon.","understanding":"Cells, genes, and evolution are three organizing ideas.","connections":"Chemistry below; ecology and mind above.","application":"Vaccines, crops, and conservation all apply biological knowledge.","advanced":"Systems biology and origins-of-life research remain open-ended."}},{"id":"cells","title":"Cells","field":"biology","wikiTitle":"Cell (biology)","aliases":["cell biology","cell"],"x":320,"y":780,"overview":"The cell is the basic unit of known life: a membrane-bounded system that maintains chemistry far from equilibrium.","whyItMatters":"Every plant, animal, and microbe is one cell or many. Disease and development are cellular processes first.","prerequisites":["chemistry"],"coreConcepts":[{"name":"Membrane","summary":"A selective barrier that defines inside and outside."},{"name":"Metabolism","summary":"Networks of reactions that harvest energy and build structure."},{"name":"Prokaryote vs eukaryote","summary":"Cells without and with a nucleus and internal organelles."}],"related":["biology","genetics","neuroscience"],"goingDeeper":["evolution"],"applications":["Cell culture","Cancer biology","Microbiology"],"check":{"prompt":"A cell membrane’s primary biological job is to:","choices":["Generate gravity.","Separate an interior chemistry from the surroundings in a controlled way.","Store the entire fossil record.","Photosynthesize in every organism."],"answer":1,"explanation":"Life requires a boundary. Membranes are that boundary, with pumps and channels that make the interior special."},"depths":{"intro":"Life as we know it is cellular.","understanding":"Compartments, energy flow, and information (DNA/RNA) coincide in cells.","connections":"Multicellularity is cells in societies. Neurons are specialized cells.","application":"Drugs often target cellular pathways.","advanced":"How the first cells arose is not yet a settled story."}},{"id":"genetics","title":"Genetics","field":"biology","wikiTitle":"Genetics","aliases":["genes","dna","heredity"],"x":480,"y":820,"overview":"Genetics studies how information is stored in genomes and transmitted across generations, and how it shapes traits.","whyItMatters":"It is the informational half of evolution and the basis of much of medicine and biotechnology.","prerequisites":["cells","probability"],"coreConcepts":[{"name":"Gene","summary":"A heritable unit of information, typically a stretch of DNA affecting a function."},{"name":"Mutation","summary":"A change in the genetic sequence."},{"name":"Variation","summary":"Differences among individuals that selection can act on."}],"related":["evolution","natural-selection","biology"],"goingDeeper":["information-theory"],"applications":["Genetic medicine","Breeding","Forensics"],"check":{"prompt":"Natural selection requires genetic variation because:","choices":["Otherwise there is nothing heritable for differential success to change in the next generation.","Genes cause gravity.","All mutations are beneficial.","DNA cannot replicate."],"answer":0,"explanation":"Selection sorts existing heritable differences. Without variation, differential survival does not change the genetic makeup of the next generation."},"depths":{"intro":"Genetics is the science of heredity.","understanding":"DNA sequence, expression, and transmission explain family resemblance and more.","connections":"Evolution is genetics plus time plus ecology.","application":"CRISPR and sequencing transformed medicine and research.","advanced":"Population genetics is the mathematical heart of evolutionary theory."}},{"id":"evolution","title":"Evolution","field":"biology","wikiTitle":"Evolution","aliases":["darwin","biological evolution"],"x":600,"y":780,"overview":"Evolution is change in the heritable traits of populations across generations. Natural selection, drift, mutation, and gene flow are its main processes.","whyItMatters":"It is the unifying theory of biology. Without it, the fit between organisms and their worlds looks like a pile of unrelated facts.","prerequisites":["genetics","natural-selection"],"coreConcepts":[{"name":"Descent with modification","summary":"Lineages change and split over time, producing the tree of life."},{"name":"Adaptation","summary":"A trait shaped by selection that improves reproductive success in a context."},{"name":"Phylogeny","summary":"The branching historical relationships among lineages."}],"related":["biology","ecology","genetics","planet-formation"],"goingDeeper":["neuroscience"],"applications":["Antibiotic resistance","Conservation","Understanding human origins"],"check":{"prompt":"Biological evolution is defined as:","choices":["Individual organisms trying to improve themselves during their lives, then passing that on as a rule.","Change in the inherited makeup of populations over generations.","The claim that life appeared suddenly without ancestors.","A ladder with humans as the necessary top."],"answer":1,"explanation":"Evolution is a population process. Individual learning is not the same as genetic change across generations (though culture is another story)."},"depths":{"intro":"Life’s diversity is a family tree, not a static catalog.","understanding":"Mutation introduces variation; selection, drift, and migration change frequencies.","connections":"Genetics provides mechanism; ecology provides the theater; deep time provides the scale.","application":"Flu vaccines and pest resistance are evolution in real time.","advanced":"Evo-devo and multilevel selection debates add nuance without undoing the core."}},{"id":"natural-selection","title":"Natural Selection","field":"biology","wikiTitle":"Natural selection","aliases":["selection","survival of the fittest"],"x":700,"y":700,"overview":"Natural selection is the process by which heritable differences that affect reproductive success become more or less common in a population.","whyItMatters":"It is the only known process that systematically produces adaptation. 'Fitness' here is reproductive, not a gym metaphor.","prerequisites":["genetics"],"coreConcepts":[{"name":"Variation","summary":"Individuals differ."},{"name":"Heredity","summary":"Some of those differences are passed on."},{"name":"Differential success","summary":"Those differences affect survival or reproduction."}],"related":["evolution","ecology","statistics"],"goingDeeper":["biology"],"applications":["Breeding (artificial selection)","Understanding resistance evolution"],"check":{"prompt":"Natural selection can occur only if:","choices":["A population is trying to evolve toward a goal.","There is heritable variation that affects reproductive success.","Every mutation is harmful.","The environment never changes."],"answer":1,"explanation":"The three ingredients — variation, heredity, differential success — are sufficient. No goal-seeking is required."},"depths":{"intro":"Selection is the filter that makes some heritable traits more common.","understanding":"It is statistical and local, not a march toward perfection.","connections":"It is one mechanism of evolution among several.","application":"Artificial selection is the same logic under human choice.","advanced":"Inclusive fitness and frequency dependence complicate simple slogans."}},{"id":"ecology","title":"Ecology","field":"biology","wikiTitle":"Ecology","aliases":["ecosystems","environment living"],"x":560,"y":900,"overview":"Ecology studies how organisms interact with each other and with their physical surroundings, from individuals to the biosphere.","whyItMatters":"Climate, food webs, and conservation are ecological problems. Evolution happens in ecological theaters.","prerequisites":["biology"],"coreConcepts":[{"name":"Niche","summary":"The range of conditions and roles in which a population persists."},{"name":"Food web","summary":"Who eats whom, and how energy and matter flow."},{"name":"Carrying capacity","summary":"A rough limit set by resources and interactions."}],"related":["evolution","biology","planet-formation"],"goingDeeper":["statistics"],"applications":["Conservation planning","Fisheries","Epidemiology of zoonoses"],"check":{"prompt":"An ecological niche is best thought of as:","choices":["A hole in a tree only.","The multidimensional role and condition-set in which a population makes a living.","The name of a species.","A fossil."],"answer":1,"explanation":"The niche is not just a place; it is a relation between organism and environment, including resources and interactions."},"depths":{"intro":"Ecology is the science of living relations.","understanding":"Populations, communities, and ecosystems are nested levels.","connections":"Evolution and ecology continually reshape each other.","application":"Restoring habitats requires ecological models, not slogans.","advanced":"Spatial ecology and coupled human-natural systems are frontier areas."}},{"id":"chemistry","title":"Chemistry","field":"biology","wikiTitle":"Chemistry","aliases":["chemical","molecules"],"x":240,"y":880,"overview":"Chemistry studies how atoms bond and how molecules transform. It sits between physics and biology.","whyItMatters":"Life is chemistry that has become organized. Materials, medicines, and energy storage are chemical technologies.","prerequisites":["quantum-mechanics","thermodynamics"],"coreConcepts":[{"name":"Bond","summary":"An interaction that holds atoms together in a molecule."},{"name":"Reaction","summary":"A rearrangement of bonds, constrained by energy and kinetics."},{"name":"Periodic table","summary":"An organization of elements by electronic structure."}],"related":["biology","cells","heavy-elements","spectroscopy"],"goingDeeper":["quantum-mechanics"],"applications":["Pharmaceuticals","Batteries","Industrial synthesis"],"check":{"prompt":"Chemical bonds are ultimately explained by:","choices":["Tiny hooks on atoms.","Electromagnetic interactions of electrons and nuclei, described by quantum mechanics.","Gravity between atoms.","Sound waves."],"answer":1,"explanation":"Bonding is a quantum-electromagnetic phenomenon. Chemistry’s rules are the useful compression of that physics."},"depths":{"intro":"Chemistry is the science of substances and their transformations.","understanding":"Electrons, nuclei, energy, and entropy govern reactions.","connections":"Quantum mechanics below; metabolism above.","application":"The material world of industry is applied chemistry.","advanced":"Computational chemistry solves Schrödinger’s equation approximately for molecules."}},{"id":"neuroscience","title":"Neuroscience","field":"mind","wikiTitle":"Neuroscience","aliases":["brain science","nervous system"],"x":820,"y":760,"overview":"Neuroscience studies nervous systems: how neurons encode, compute, and drive behavior.","whyItMatters":"It is the empirical path into perception, movement, memory, and — more tentatively — consciousness.","prerequisites":["cells","biology"],"coreConcepts":[{"name":"Neuron","summary":"An electrically excitable cell that signals with spikes and synapses."},{"name":"Circuit","summary":"Networks of neurons that implement functions."},{"name":"Plasticity","summary":"Experience-dependent change in connection strength or structure."}],"related":["consciousness","biology","computer-science"],"goingDeeper":["philosophy"],"applications":["Neurology","Brain-computer interfaces","Psychiatric research"],"check":{"prompt":"A spike (action potential) is:","choices":["A hole in the skull.","A rapid electrical impulse used by neurons to signal over axons.","A type of hormone only.","Proof of a non-physical mind."],"answer":1,"explanation":"Action potentials are physical events in membranes. They are the long-distance currency of many nervous systems."},"depths":{"intro":"Brains are organs made of signaling cells.","understanding":"From ions
