to circuits to behavior is the explanatory stack.","connections":"Computing offers metaphors; they must be checked against biology.","application":"Stroke, epilepsy, and Parkinson’s are circuit and cellular disorders.","advanced":"How large-scale dynamics yield cognition is unsolved in detail."}},{"id":"consciousness","title":"Consciousness","field":"mind","wikiTitle":"Consciousness","aliases":["awareness","subjective experience","phenomenal consciousness"],"x":940,"y":840,"overview":"Consciousness refers to subjective experience — what it is like to see, feel, or think. Science studies its correlates; philosophy debates its nature.","whyItMatters":"It is among the hardest problems we have: empirically real for each of us, theoretically unsettled. Distinguishing fact, model, and speculation is part of understanding it.","prerequisites":["neuroscience","philosophy","epistemology"],"coreConcepts":[{"name":"Experience","summary":"The qualitative, first-person aspect of mental life."},{"name":"Neural correlates","summary":"Brain processes that track conscious states."},{"name":"Access vs phenomenal","summary":"Information available for report versus the felt quality itself."}],"related":["neuroscience","philosophy","quantum-mechanics"],"goingDeeper":["ethics"],"applications":["Anesthesia monitoring","Disorders of consciousness","AI debates (interpret with care)"],"check":{"prompt":"A careful scientific stance on consciousness is that:","choices":["We already have a complete physical reduction accepted by all researchers.","Experience is a real target of study, with neural correlates, while its deepest explanation remains disputed.","Quantum mechanics has solved it.","It is identical to attention in every experiment."],"answer":1,"explanation":"There is a productive empirical program and no consensus theory of why experience exists. Quantum slogans do not close the issue."},"depths":{"intro":"Consciousness is experience itself, not merely behavior.","understanding":"We can map correlates and manipulate states; we do not yet have an agreed theory of the phenomenon.","connections":"Philosophy clarifies the questions; neuroscience supplies constraints.","application":"Medicine must treat unresponsive patients without a finished theory.","advanced":"Integrated information, global workspace, and higher-order theories compete; none is settled."}},{"id":"philosophy","title":"Philosophy","field":"humanities","wikiTitle":"Philosophy","aliases":["philosophical"],"x":1080,"y":780,"overview":"Philosophy examines fundamental questions about knowledge, reality, value, and meaning using argument rather than experiment alone.","whyItMatters":"Sciences inherit concepts — cause, evidence, mind, person — that philosophy makes explicit. Bad philosophy is still philosophy; it is better done on purpose.","prerequisites":["epistemology"],"coreConcepts":[{"name":"Argument","summary":"A structured set of reasons offered in support of a claim."},{"name":"Conceptual analysis","summary":"Clarifying what our terms commit us to."},{"name":"Thought experiment","summary":"An imagined case used to test a principle."}],"related":["epistemology","ethics","consciousness","history"],"goingDeeper":["mathematics"],"applications":["Bioethics","Foundations of science","Law and political theory"],"check":{"prompt":"Philosophy, as practiced in this atlas, is primarily:","choices":["A replacement for all empirical science.","The disciplined examination of fundamental concepts and arguments.","A list of famous quotes.","The same as religion."],"answer":1,"explanation":"Philosophy clarifies and argues. It does not replace measurement, but measurement always uses concepts that can be examined."},"depths":{"intro":"Philosophy asks what our most basic ideas actually mean and whether they hang together.","understanding":"Logic, epistemology, ethics, and metaphysics are classic divisions.","connections":"Every science has a philosophical layer, usually unnoticed until it breaks.","application":"Ethics committees and constitutional law run on philosophical distinctions.","advanced":"Formal philosophy overlaps with logic and the foundations of mathematics."}},{"id":"epistemology","title":"Epistemology","field":"mind","wikiTitle":"Epistemology","aliases":["theory of knowledge","knowledge theory"],"x":980,"y":700,"overview":"Epistemology is the theory of knowledge and justified belief: what it means to know, and how evidence supports claims.","whyItMatters":"Science, journalism, and daily life all depend on distinguishing better from worse reasons. This is the map of that distinction.","prerequisites":[],"coreConcepts":[{"name":"Justification","summary":"The reasons that make a belief more than a guess."},{"name":"Evidence","summary":"Information that bears on whether a claim is true."},{"name":"Skepticism","summary":"Challenges that ask whether our methods can reach knowledge."}],"related":["philosophy","statistics","science-method"],"goingDeeper":["consciousness"],"applications":["Scientific method","Legal standards of proof","Media literacy"],"check":{"prompt":"Having a true belief is not automatically knowledge, in standard epistemology, because:","choices":["Truth does not exist.","The belief may be true by luck, without adequate justification.","Only scientists can know things.","Beliefs cannot be about the world."],"answer":1,"explanation":"The classical analysis requires something like justification (or a reliable process), not a lucky guess that happens to be right."},"depths":{"intro":"Epistemology asks how we can know anything.","understanding":"Belief, truth, and justification (or reliability) are the traditional pieces.","connections":"Statistics operationalizes uncertain evidence. Science is organized epistemology.","application":"Evaluating sources is applied epistemology.","advanced":"Formal epistemology uses probability to model degrees of belief."}},{"id":"science-method","title":"Scientific Method","field":"humanities","wikiTitle":"Scientific method","aliases":["science","scientific inquiry"],"x":860,"y":620,"overview":"The scientific method is a family of practices: forming hypotheses, testing them against observation, and revising models when they fail.","whyItMatters":"It is why later centuries know more than earlier ones about the physical world. It is not a single recipe, but it is not 'anything goes' either.","prerequisites":["epistemology"],"coreConcepts":[{"name":"Hypothesis","summary":"A testable claim about how something works."},{"name":"Falsifiability","summary":"A good scientific claim rules some observations out."},{"name":"Replication","summary":"Independent checks that a result was not a fluke."}],"related":["statistics","physics","philosophy"],"goingDeeper":["history"],"applications":["Experimental design","Clinical trials","Engineering validation"],"check":{"prompt":"A scientific hypothesis is useful when it:","choices":["Cannot be tested, so it can never fail.","Makes claims that evidence could count against.","Is believed by a majority regardless of data.","Uses the longest words available."],"answer":1,"explanation":"If nothing could count against a claim, observation cannot help you. Testability is the price of learning from the world."},"depths":{"intro":"Science learns by putting ideas at risk against observation.","understanding":"Models, measurement, and community criticism are the engine.","connections":"Statistics is how uncertain tests are interpreted.","application":"Every lab protocol is a local scientific method.","advanced":"Philosophy of science debates realism, explanation, and theory change."}},{"id":"ethics","title":"Ethics","field":"humanities","wikiTitle":"Ethics","aliases":["moral philosophy","morality"],"x":1180,"y":880,"overview":"Ethics is the study of how we ought to act and live, and of the reasons we give for those judgments.","whyItMatters":"Technology, medicine, and politics continually force value questions that facts alone do not settle. Clarity here prevents smuggling values as if they were measurements.","prerequisites":["philosophy"],"coreConcepts":[{"name":"Normative claim","summary":"A claim about what should be, not merely what is."},{"name":"Consequence vs duty","summary":"Two families of moral theory: outcomes versus principles."},{"name":"Moral patient","summary":"A being whose interests count morally."}],"related":["philosophy","consciousness","history"],"goingDeeper":["french-revolution"],"applications":["Medical ethics","AI policy debates","Environmental ethics"],"check":{"prompt":"A key distinction in ethics is that:","choices":["Every scientific fact is already a moral command.","Descriptive claims about what is are not automatically claims about what ought to be.","Ethics forbids using reasons.","Only laws can be ethical."],"answer":1,"explanation":"Hume’s gap (is versus ought) is a starting point: you need additional moral premises to get from facts to duties."},"depths":{"intro":"Ethics asks what we have reason to do.","understanding":"Theories compete: consequences, duties, virtues, care.","connections":"Political history is ethics under pressure.","application":"Hospital ethics boards work these questions in concrete cases.","advanced":"Metaethics asks what moral claims even are."}},{"id":"history","title":"History","field":"humanities","wikiTitle":"History","aliases":["the past","historical study"],"x":1320,"y":760,"overview":"History is the disciplined study of the human past using evidence: documents, objects, and traces, interpreted with care.","whyItMatters":"Without history, present institutions look natural and inevitable. With it, they look like choices that could have gone otherwise.","prerequisites":["epistemology"],"coreConcepts":[{"name":"Source","summary":"A surviving trace of the past, never a transparent window."},{"name":"Context","summary":"The conditions that made an action make sense to those who lived it."},{"name":"Narrative","summary":"A structured account — always selective, hopefully honest about that."}],"related":["french-revolution","philosophy","science-method"],"goingDeeper":["ethics"],"applications":["Civic understanding","Legal precedent","Museum interpretation"],"check":{"prompt":"A primary source is valuable because it:","choices":["Is always unbiased.","Comes from the time under study and can be interrogated as evidence.","Replaces the need for interpretation.","Is written in the future."],"answer":1,"explanation":"Primary sources are still partial and interested. Historians read them as evidence, not as oracles."},"depths":{"intro":"History reconstructs human pasts from incomplete evidence.","understanding":"Sources plus critical method; not memorizing dates alone.","connections":"Revolutions, science, and ideas all have histories that explain their present form.","application":"Policy that ignores history repeats other people’s experiments blindly.","advanced":"Historiography is the study of how history itself is written."}},{"id":"french-revolution","title":"French Revolution","field":"humanities","wikiTitle":"French Revolution","aliases":["revolution francaise","1789","france 1789"],"x":1440,"y":840,"overview":"The French Revolution (from 1789) overthrew the Bourbon monarchy’s old order and unleashed a cascade of political experiments, wars, and ideas about rights and sovereignty.","whyItMatters":"Modern politics — left and right, nation and rights, terror and constitution — still speaks a language forged in those years. It is a case study in how ideas and material crisis interact.","prerequisites":["history"],"coreConcepts":[{"name":"Ancien régime","summary":"The pre-revolutionary social and political order in France."},{"name":"Sovereignty of the nation","summary":"The claim that political authority rests in the people, not the king’s body."},{"name":"Terror","summary":"Revolutionary emergency violence, later a warning in political memory."}],"related":["ethics","philosophy","history"],"goingDeeper":["epistemology"],"applications":["Understanding modern political ideologies","Debates on human rights"],"check":{"prompt":"A historically careful view of 1789–1799 is that the Revolution:","choices":["Was a single afternoon of unanimous joy with no violence.","Combined real structural crisis, new political ideas, and phases that included both rights declarations and terror.","Had no effect outside France.","Was caused only by a single book."],"answer":1,"explanation":"Fiscal crisis, social structure, and Enlightenment political language all mattered. The decade was not one mood; it had stages."},"depths":{"intro":"France’s revolution ended a monarchy and remade the idea of political legitimacy.","understanding":"Causes were plural: debt, inequality, political culture, and contingency.","connections":"Enlightenment philosophy supplied vocabulary; later revolutions borrowed the script.","application":"Contemporary words like 'left' and 'right' have seating-plan origins in this era.","advanced":"Historians still argue about class, culture, gender, and global context."}},{"id":"computer-science","title":"Computer Science","field":"computing","wikiTitle":"Computer science","aliases":["computing","cs"],"x":980,"y":300,"overview":"Computer science studies computation: what can be calculated, how efficiently, and how to build reliable processes that do it.","whyItMatters":"It is the theoretical home of algorithms and complexity, and the practical home of the software world.","prerequisites":["mathematics","algorithms"],"coreConcepts":[{"name":"Computation","summary":"Rule-governed transformation of information."},{"name":"Abstraction","summary":"Hiding detail behind interfaces so systems can scale."},{"name":"Complexity","summary":"How resource use grows with problem size."}],"related":["algorithms","information-theory","quantum-computing"],"goingDeeper":["cryptography"],"applications":["Software systems","Scientific computing","Cryptography"],"check":{"prompt":"Computer science is not only programming because:","choices":["Programming is illegal.","It also asks what is computable and at what cost, independent of a particular language.","Computers cannot run programs.","Mathematics is unrelated."],"answer":1,"explanation":"Programming is one craft. Computability and complexity are scientific questions that outlive any language."},"depths":{"intro":"Computer science is the study of processes that manipulate information.","understanding":"Algorithms, data structures, and machines form a stack of ideas.","connections":"Information theory and logic are neighbors; quantum computing is a new machine model.","application":"Every app is applied computer science, for better or worse.","advanced":"Type theory, distributed systems, and complexity classes are deep subfields."}},{"id":"algorithms","title":"Algorithms","field":"computing","wikiTitle":"Algorithm","aliases":["algorithm","procedures"],"x":880,"y":220,"overview":"An algorithm is a definite procedure for solving a problem. Analysis asks whether it is correct and how its cost scales.","whyItMatters":"Search, encryption, graphics, and learning are algorithm design. Intuition about 'just throw hardware at it' fails when scaling is exponential.","prerequisites":["mathematics"],"coreConcepts":[{"name":"Correctness","summary":"The procedure does what it claims for all valid inputs."},{"name":"Asymptotics","summary":"How time or memory grows as inputs get large."},{"name":"Data structure","summary":"A way of laying out data so operations are cheap."}],"related":["computer-science","quantum-computing","number-theory"],"goingDeeper":["information-theory"],"applications":["Search engines","Routing","Compression","Cryptography"],"check":{"prompt":"Why does asymptotic complexity matter?","choices":["It does not; only constant factors ever matter.","It predicts how cost explodes as problems grow, which constants cannot hide forever.","It proves every problem is easy.","It is only used in astronomy."],"answer":1,"explanation":"An O(2^n) method will drown any constant-speed hardware as n grows. That is why complexity class is a real constraint."},"depths":{"intro":"Algorithms are recipes with guarantees.","understanding":"Proofs of correctness and of resource bounds are the theory.","connections":"Number theory supplies crypto algorithms; quantum mechanics supplies a new model.","application":"Industry is applied algorithmics under messy constraints.","advanced":"Approximation, randomness, and lower bounds are the fine structure."}},{"id":"information-theory","title":"Information Theory","field":"computing","wikiTitle":"Information theory","aliases":["shannon","entropy information","bits"],"x":780,"y":140,"overview":"Information theory, founded by Shannon, quantifies information, compression, and communication in the presence of noise.","whyItMatters":"Bits are not a metaphor here; they are a measurable resource. The same mathematics later illuminated physics and biology — with care about when the analogy is exact.","prerequisites":["probability"],"coreConcepts":[{"name":"Entropy","summary":"A measure of uncertainty, or of the information in a random source."},{"name":"Channel capacity","summary":"The maximum reliable communication rate of a noisy channel."},{"name":"Compression","summary":"Representing typical messages with fewer bits."}],"related":["probability","thermodynamics","quantum-information","genetics"],"goingDeeper":["cryptography"],"applications":["Telecom","Compression formats","Error-correcting codes"],"check":{"prompt":"Shannon entropy measures:","choices":["Temperature of a computer.","The uncertainty of a random source, in bits (or nats).","Moral value of a message.","The speed of light."],"answer":1,"explanation":"Entropy here is a property of a probability distribution over messages. It is related to, but not identical with, thermodynamic entropy."},"depths":{"intro":"Information can be measured.","understanding":"Sources, channels, and codes are the three pillars.","connections":"Quantum information generalizes the bit. Biology borrows the language for genomes.","application":"Your phone’s radio is Shannon’s theory in silicon.","advanced":"Algorithmic information (Kolmogorov complexity) is a different, deeper notion of information."}},{"id":"cryptography","title":"Cryptography","field":"computing","wikiTitle":"Cryptography","aliases":["encryption","crypto"],"x":700,"y":80,"overview":"Cryptography is the design and analysis of systems that protect information from adversaries: secrecy, authenticity, and integrity.","whyItMatters":"The internet is unusable as a trusted medium without it. Quantum computers threaten some classical schemes, which is why the field is moving.","prerequisites":["number-theory","computer-science","algorithms"],"coreConcepts":[{"name":"Key","summary":"Secret or public material that parameterizes a cryptographic scheme."},{"name":"Attack model","summary":"A precise statement of what an adversary can see and do."},{"name":"Reduction","summary":"A proof that breaking the scheme would solve a believed-hard problem."}],"related":["quantum-computing","number-theory","information-theory"],"goingDeeper":["quantum-information"],"applications":["HTTPS","Messaging","Digital signatures"],"check":{"prompt":"Modern cryptography’s security claims are typically:","choices":["That a cipher is pretty and therefore safe.","Arguments that a realistic adversary cannot break a scheme except by solving a hard problem (or by stealing keys).","Guarantees that no computer can ever decrypt anything.","Based only on keeping the algorithm secret."],"answer":1,"explanation":"Kerckhoffs’s principle: security should rest on keys and hard problems, not on hiding how the algorithm works."},"depths":{"intro":"Cryptography is adversarial information protection.","understanding":"Definitions first, then constructions, then proofs.","connections":"Number theory and complexity theory are the wellsprings. Quantum changes the catalog of hard problems.","application":"Every padlock icon in a browser is this field.","advanced":"Post-quantum schemes and zero-knowledge proofs are current research-to-practice pipelines."}},{"id":"music","title":"Music","field":"arts","wikiTitle":"Music","aliases":["musical","harmony"],"x":200,"y":140,"overview":"Music is organized sound in time. It can be studied as acoustics, as mathematics of ratio, as culture, and as a practice.","whyItMatters":"It is a universal human art that sits on physics (waves) and mathematics (ratio, rhythm) without reducing to either.","prerequisites":[],"coreConcepts":[{"name":"Pitch","summary":"How high or low a tone is, related to frequency."},{"name":"Harmony","summary":"Tones sounding together, often in simple frequency ratios."},{"name":"Rhythm","summary":"Patterned time."}],"related":["mathematics","physics","art"],"goingDeeper":["information-theory"],"applications":["Composition","Audio engineering","Film","Cognitive science of hearing"],"check":{"prompt":"A musical octave corresponds physically to:","choices":["A doubling of frequency.","A random noise burst.","A gravitational wave.","A change in temperature only."],"answer":0,"explanation":"An octave is a 2:1 frequency ratio. That simple mathematics is why octaves feel like 'the same note' across cultures more often than chance."},"depths":{"intro":"Music is patterned sound that people treat as meaningful.","understanding":"Acoustics plus cultural systems of scale and meter.","connections":"Fourier analysis (calculus/linear algebra) is how we decompose tones.","application":"Recording and synthesis are applied physics and computing.","advanced":"Music cognition and algorithmic composition sit at several field borders."}},{"id":"art","title":"Visual Art","field":"arts","wikiTitle":"Visual arts","aliases":["art","painting","visual arts"],"x":80,"y":80,"overview":"Visual art is the making and seeing of images and forms. It has techniques, histories, and theories — not only 'expression'.","whyItMatters":"Images train attention. Perspective is geometry; color is psychophysics; style is history.","prerequisites":[],"coreConcepts":[{"name":"Composition","summary":"How parts are arranged so a work holds together."},{"name":"Perspective","summary":"Geometric systems for depicting space."},{"name":"Medium","summary":"The materials and constraints of making."}],"related":["geometry","history","music"],"goingDeeper":["philosophy"],"applications":["Design","Architecture","Visual communication"],"check":{"prompt":"Linear perspective in drawing is primarily:","choices":["A purely emotional state.","A geometric method for projecting three-dimensional relations onto a plane.","A type of music.","A chemical reaction."],"answer":1,"explanation":"Renaissance perspective is applied geometry. That does not exhaust art, but it is a real connection on this atlas."},"depths":{"intro":"Visual art organizes seeing.","understanding":"Form, material, and cultural context all count.","connections":"Geometry, optics, and history meet in pictures.","application":"Design is art under constraint.","advanced":"Aesthetics asks what, if anything, unifies the arts."}}];
    window.FIELDS = {"mathematics":{"label":"Mathematics","brief":"Language of structure, change, and uncertainty."},"physics":{"label":"Physics","brief":"How matter, energy, space, and time behave."},"astronomy":{"label":"Astronomy","brief":"Worlds, stars, and the history of the cosmos."},"biology":{"label":"Biology","brief":"Living systems, from cells to lineages."},"mind":{"label":"Mind","brief":"Brains, experience, and how we know."},"computing":{"label":"Computing","brief":"Information, algorithms, and machines."},"humanities":{"label":"Humanities","brief":"People, events, and ideas across time."},"arts":{"label":"Arts","brief":"Pattern, sound, and meaning made by people."}};
  </script>
  <script>
/* Eagle Panorama — single-file client. Topics arrive as window.TOPICS / window.FIELDS. */
(function () {
  const TOPICS = window.TOPICS;
  const FIELDS = window.FIELDS;
  const FEATURED = [
    "quantum-mechanics",
    "black-holes",
    "evolution",
    "consciousness",
    "calculus",
    "french-revolution",
    "stars",
    "music",
  ];
  const BY_ID = Object.fromEntries(TOPICS.map((t) => [t.id, t]));
  const SLIDES = [
    ["01 / 08", "Take a step back.", "Eagle Panorama is a learning explorer. The point is not another encyclopedia page. It is to see where a subject sits in the wider landscape of knowledge."],
    ["02 / 08", "Information is everywhere. Context is harder.", "A typical search ends with one isolated fact. This atlas asks what a subject rests on, what sits beside it, and what comes after."],
    ["03 / 08", "A journey, not a search result.", "Search, then understand, connect, verify, and go deeper. Authored structure first. Live public sources when a topic is not in the atlas yet."],
    ["04 / 08", "One system, several ways in.", "An authored atlas, a readable knowledge map, five depth levels, a short conceptual check, and a personal atlas stored only in this browser."],
    ["05 / 08", "The map is an atlas, not a night sky.", "The board stays light so labels and lines stay readable. Dark lines are prerequisites. Steel lines are related ideas. Brown lines go deeper."],
    ["06 / 08", "Seen versus understood.", "A short question distinguishes recognition from grasp. It is not a school exam. Passing it marks the topic as understood in your atlas."],
    ["07 / 08", "What it does not claim.", "Nothing here is a validated curriculum. Auto-drawn links are exploration aids. Live pages depend on Wikipedia being reachable."],
    ["08 / 08", "Try one journey.", "Search Quantum mechanics. Open a prerequisite. Walk the map. Take the check. Save it to My Atlas. Leave with a larger mental map than you arrived with."],
  ];
  const DEPTHS = [
    ["intro", "1 · Introduction", "What is this?"],
    ["understanding", "2 · Understanding", "How does it work?"],
    ["connections", "3 · Connections", "How does it relate?"],
    ["application", "4 · Application", "Where is it used?"],
    ["advanced", "5 · Advanced", "How deep does it go?"],
  ];

  let searchError = "";
  let searchBusy = false;
  let lastQuery = "";
  let slide = 0;
  let depthKey = "intro";
  let choice = null;
  let submitted = false;
  const wikiCache = {};

  function slugify(value) {
    return String(value)
      .normalize("NFKD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");
  }

  function norm(value) {
    return String(value)
      .normalize("NFKD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, " ")
      .trim();
  }

  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, (c) => "&#" + c.charCodeAt(0) + ";");
  }

  function matchTopic(query) {
    const q = norm(query);
    if (!q) return null;
    return (
      TOPICS.find((t) => norm(t.title) === q || t.id === slugify(query) || t.aliases.some((a) => norm(a) === q)) ||
      TOPICS.find(
        (t) =>
          norm(t.title).includes(q) ||
          q.includes(norm(t.title)) ||
          t.aliases.some((a) => norm(a).includes(q) || q.includes(norm(a))),
      ) ||
      null
    );
  }

  function suggest(query, limit) {
    const q = norm(query);
    const n = limit || 6;
    if (!q) return [];
    return TOPICS.map((t) => {
      const hay = [t.title, t.id, ...t.aliases, t.overview].map(norm).join(" ");
      let score = 0;
      if (norm(t.title) === q) score += 100;
      if (t.aliases.some((a) => norm(a) === q)) score += 90;
      if (norm(t.title).startsWith(q)) score += 40;
      if (hay.includes(q)) score += 20;
      q.split(" ").forEach((part) => {
        if (part && hay.includes(part)) score += 6;
      });
      return { t, score };
    })
      .filter((row) => row.score > 0)
      .sort((a, b) => b.score - a.score)
      .slice(0, n)
      .map((row) => row.t);
  }

  function loadAtlas() {
    try {
      return JSON.parse(localStorage.getItem("eagle-panorama-html") || '{"entries":{},"recent":[]}');
    } catch {
      return { entries: {}, recent: [] };
    }
  }

  function saveAtlas(atlas) {
    localStorage.setItem("eagle-panorama-html", JSON.stringify(atlas));
  }

  function visit(id, title) {
    const atlas = loadAtlas();
    const prev = atlas.entries[id] || { id, title, status: "explored", checkPassed: false };
    atlas.entries[id] = Object.assign({}, prev, { title, lastVisit: Date.now() });
    atlas.recent = [id, ...atlas.recent.filter((x) => x !== id)].slice(0, 12);
    saveAtlas(atlas);
  }

  function chip(id) {
    const topic = BY_ID[id];
    if (!topic) return '<span class="chip">' + esc(id) + "</span>";
    return '<a class="chip" href="#/topic/' + topic.id + '">' + esc(topic.title) + "</a>";
  }

  function route() {
    const hash = (location.hash || "#/").replace(/^#/, "");
    const path = hash.split("?")[0];
    const query = new URLSearchParams(hash.split("?")[1] || "");
    const parts = path.split("/").filter(Boolean);
    if (parts[0] === "map") return { name: "map" };
    if (parts[0] === "atlas") return { name: "atlas" };
    if (parts[0] === "present") return { name: "present" };
    if (parts[0] === "topic" && parts[1]) return { name: "topic", slug: decodeURIComponent(parts[1]), wiki: query.get("wiki") };
    return { name: "home" };
  }

  async function wikiSummary(title) {
    if (wikiCache[title]) return wikiCache[title];
    try {
      const res = await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(title), {
        headers: { Accept: "application/json" },
      });
      if (!res.ok) {
        wikiCache[title] = {
          error: res.status === 404 ? "Wikipedia has no summary titled “" + title + "”." : "Wikipedia summary failed (" + res.status + ").",
        };
        return wikiCache[title];
      }
      const data = await res.json();
      wikiCache[title] = {
        extract: data.extract,
        url: data.content_urls && data.content_urls.desktop && data.content_urls.desktop.page,
        description: data.description,
      };
      return wikiCache[title];
    } catch {
      wikiCache[title] = { error: "Could not reach Wikipedia. Curated atlas topics still work offline." };
      return wikiCache[title];
    }
  }

  async function wikiSearch(query) {
    try {
      const res = await fetch(
        "https://en.wikipedia.org/w/api.php?action=query&list=search&utf8=1&format=json&origin=*&srlimit=6&srsearch=" +
          encodeURIComponent(query),
      );
      if (!res.ok) return { error: "Wikipedia search returned " + res.status + "." };
      const data = await res.json();
      const hits = ((data.query && data.query.search) || []).map((row) => ({ title: row.title }));
      if (!hits.length) return { error: "No Wikipedia pages matched “" + query + "”. Try a simpler name." };
      return { hits };
    } catch {
      return { error: "Could not reach Wikipedia from this browser. Atlas topics still work without it." };
    }
  }

  async function explore(raw) {
    const input = document.getElementById("q");
    const value = (raw != null ? raw : input ? input.value : "").trim();
    lastQuery = value;
    searchError = "";
    if (!value) {
      searchError = "Type a subject — for example quantum mechanics, black holes, or the French Revolution.";
      render();
      return;
    }
    const curated = matchTopic(value);
    if (curated) {
      location.hash = "#/topic/" + curated.id;
      return;
    }
    searchBusy = true;
    render();
    const result = await wikiSearch(value);
    searchBusy = false;
    if (result.hits && result.hits[0]) {
      location.hash = "#/topic/" + slugify(result.hits[0].title) + "?wiki=" + encodeURIComponent(result.hits[0].title);
      return;
    }
    searchError = result.error || "Nothing matched.";
    render();
  }

  function searchBox(showFeatured) {
    const matches = lastQuery.trim() ? suggest(lastQuery) : [];
    return (
      '<div class="search">' +
      '<input id="q" type="text" placeholder="What do you want to understand?" value="' +
      esc(lastQuery) +
      '" aria-label="Search topics" autocomplete="off" />' +
      '<button class="btn" id="go" type="button">' +
      (searchBusy ? "Searching…" : "Explore") +
      "</button></div>" +
      (searchError ? '<p class="error">' + esc(searchError) + "</p>" : "") +
      (matches.length
        ? '<div class="suggest">' +
          matches
            .map(
              (t) =>
                '<button type="button" data-go="' +
                esc(t.title) +
                '"><span>' +
                esc(t.title) +
                '</span><span class="subtle">' +
                esc(FIELDS[t.field].label) +
                "</span></button>",
            )
            .join("") +
          "</div>"
        : "") +
      (showFeatured
        ? '<div class="chips">' +
          FEATURED.filter((id) => BY_ID[id])
            .map((id) => '<a class="chip" href="#/topic/' + id + '">' + esc(BY_ID[id].title) + "</a>")
            .join("") +
          "</div>"
        : "")
    );
  }

  function home() {
    return (
      '<section class="hero"><p class="kicker">Knowledge atlas</p><h1>What do you want to understand?</h1>' +
      '<p class="lede">Do not stop at an isolated article. See what a subject rests on, what it connects to, and how far it goes — like looking at a landscape rather than a single tree.</p>' +
      searchBox(true) +
      '<div class="steps">' +
      ["Explore", "Understand", "Connect", "Verify", "Go deeper"]
        .map((step, i) => '<span>' + (i + 1) + " " + step + "</span>")
        .join("") +
      "</div></section>" +
      "<h2>Fields in the atlas</h2><div class=\"grid\">" +
      Object.keys(FIELDS)
        .map((id) => {
          const field = FIELDS[id];
          const count = TOPICS.filter((t) => t.field === id).length;
          return (
            '<a class="card" href="#/map"><strong class="display">' +
            esc(field.label) +
            '</strong><p class="muted">' +
            esc(field.brief) +
            '</p><p class="subtle">' +
            count +
            " topics</p></a>"
          );
        })
        .join("") +
      "</div>"
    );
  }

  function mapView() {
    const width = 1600;
    const height = 980;
    const edges = [];
    TOPICS.forEach((topic) => {
      topic.prerequisites.forEach((id) => BY_ID[id] && edges.push([topic, BY_ID[id], "#3d5a45"]));
      topic.related.forEach((id) => BY_ID[id] && edges.push([topic, BY_ID[id], "#6a7c8a"]));
      topic.goingDeeper.forEach((id) => BY_ID[id] && edges.push([topic, BY_ID[id], "#5b4a32"]));
    });
    return (
      '<p class="kicker">Knowledge map</p><h1>The atlas board</h1>' +
      '<p class="lede left">A readable map of authored connections — not a decorative night sky. Drag to pan. Scroll to zoom. Click a label to open the topic.</p>' +
      searchBox(false) +
      '<div class="board-wrap"><div class="board" id="board"><svg id="atlasvg" viewBox="0 0 ' +
      width +
      " " +
      height +
      '" width="' +
      width +
      '" height="' +
      height +
      '"><rect width="' +
      width +
      '" height="' +
      height +
      '" fill="#eef1e8"/>' +
      edges
        .map(
          (edge) =>
            '<line x1="' +
            edge[0].x +
            '" y1="' +
            edge[0].y +
            '" x2="' +
            edge[1].x +
            '" y2="' +
            edge[1].y +
            '" stroke="' +
            edge[2] +
            '" stroke-width="1.2" stroke-opacity="0.75"/>',
        )
        .join("") +
      TOPICS.map(
        (t) =>
          '<a href="#/topic/' +
          t.id +
          '"><g transform="translate(' +
          t.x +
          "," +
          t.y +
          ')"><circle r="8" fill="#2c3828"/><circle r="3.5" fill="#eef1e8"/><text x="14" y="5" fill="#1a2118" font-size="13" font-family="Source Sans 3, Segoe UI, sans-serif" font-weight="500">' +
          esc(t.title) +
          "</text></g></a>",
      ).join("") +
      '</svg></div><p class="legend">Dark lines: prerequisites. Steel: related. Brown: going deeper.</p></div>'
    );
  }

  function topicView(current) {
    const topic = BY_ID[current.slug] || matchTopic(current.slug.replace(/-/g, " "));
    const title = (topic && topic.title) || current.wiki || current.slug;
    if (topic) visit(topic.id, topic.title);
    const wikiTitle = current.wiki || (topic && topic.wikiTitle) || title;
    const wiki = wikiCache[wikiTitle];
    if (!wiki) wikiSummary(wikiTitle).then(() => render());
    const atlas = loadAtlas();
    const entry = topic ? atlas.entries[topic.id] : null;
    const related = topic ? [...new Set([...topic.prerequisites, ...topic.related, ...topic.goingDeeper])] : [];
    let body =
      '<article class="topic"><p class="kicker">' +
      esc(topic ? FIELDS[topic.field].label : "Live source") +
      "</p><h1>" +
      esc(title) +
      '</h1><p class="lede left">' +
      esc((topic && topic.depths.intro) || (wiki && wiki.description) || "A live entry from Wikipedia, with connections when the atlas can find them.") +
      "</p>";
    if (topic) {
      body +=
        '<div class="row">' +
        ["explored", "learning", "understood"]
          .map(
            (status) =>
              '<button type="button" class="btn sm ' +
              (entry && entry.status === status ? "" : "secondary") +
              '" data-status="' +
              status +
              '">' +
              status +
              "</button>",
          )
          .join("") +
        '<a class="chip" href="#/map">See on the map</a></div>';
    }
    body +=
      '<section class="section"><h2>Overview</h2><p>' +
      esc((topic && topic.overview) || (wiki && wiki.extract) || "") +
      "</p>" +
      (wiki && wiki.error ? '<p class="muted">' + esc(wiki.error) + "</p>" : "") +
      (wiki && wiki.extract && topic
        ? '<div class="card inset"><p class="subtle">Wikipedia extract</p><p class="muted">' +
          esc(wiki.extract) +
          "</p>" +
          (wiki.url ? '<p><a class="link" href="' + esc(wiki.url) + '" target="_blank" rel="noreferrer">Open full article</a></p>' : "") +
          "</div>"
        : "") +
      "</section>";
    if (!topic) {
      body +=
        '<section class="section"><h2>Connected reading</h2><p class="muted">This subject is not yet a fully authored atlas entry. The summary above is a live public source, not a curated path.</p></section></article>';
      return body;
    }
    body +=
      '<section class="section"><h2>Why it matters</h2><p>' +
      esc(topic.whyItMatters) +
      '</p></section><section class="section"><h2>Prerequisites</h2><p class="muted">Understand these first — they make this topic readable.</p><div class="row">' +
      (topic.prerequisites.length ? topic.prerequisites.map(chip).join("") : '<p class="muted">No required prior topics — a good entry point.</p>') +
      '</div></section><section class="section"><h2>Core concepts</h2><div class="concepts">' +
      topic.coreConcepts
        .map((concept) => '<div class="card"><strong>' + esc(concept.name) + '</strong><p class="muted">' + esc(concept.summary) + "</p></div>")
        .join("") +
      '</div></section><section class="section"><h2>Depth</h2><div class="row">' +
      DEPTHS.map(
        (level) =>
          '<button type="button" class="chip depth' +
          (depthKey === level[0] ? " on" : "") +
          '" data-depth="' +
          level[0] +
          '"><span class="subtle">' +
          esc(level[1]) +
          "</span>" +
          esc(level[2]) +
          "</button>",
      ).join("") +
      "</div><p class=\"depth-copy\">" +
      esc(topic.depths[depthKey]) +
      '</p></section><section class="section"><h2>Related topics</h2><div class="row">' +
      related.map(chip).join("") +
      '</div></section><section class="section"><h2>Going deeper</h2><div class="row">' +
      topic.goingDeeper.map(chip).join("") +
      '</div></section><section class="section"><h2>Applications</h2><ul class="muted">' +
      topic.applications.map((item) => "<li>" + esc(item) + "</li>").join("") +
      '</ul></section><section class="section card"><p class="kicker">Verify understanding</p><h2>Have you understood this, or only seen it?</h2><p class="muted">This is not an exam. It checks whether the idea can be used, not merely recognized.</p><p><strong>' +
      esc(topic.check.prompt) +
      "</strong></p>" +
      topic.check.choices
        .map(
          (option, index) =>
            '<button type="button" class="choice' +
            (choice === index ? " sel" : "") +
            '" data-choice="' +
            index +
            '">' +
            esc(option) +
            "</button>",
        )
        .join("") +
      '<p class="check-row"><button class="btn" id="checkbtn" type="button">Check</button></p>' +
      (submitted
        ? '<p class="muted">' +
          (choice === topic.check.answer ? "That matches the core idea. " : "Not quite — see the note below. ") +
          esc(topic.check.explanation) +
          "</p>"
        : "") +
      "</section></article>";
    return body;
  }

  function atlasView() {
    const atlas = loadAtlas();
    const list = Object.values(atlas.entries).sort((a, b) => (b.lastVisit || 0) - (a.lastVisit || 0));
    return (
      "<h1>My atlas</h1><p class=\"lede left\">A private record in this browser: what you have explored, what you are learning, and what you have actually checked.</p>" +
      (list.length ? '<p><button class="btn sm secondary" id="clearatlas" type="button">Clear local atlas</button></p>' : "") +
      (list.length
        ? '<div class="concepts">' +
          list
            .map(
              (entry) =>
                '<a class="card" href="#/topic/' +
                esc(entry.id) +
                '"><strong class="display">' +
                esc(entry.title) +
                '</strong><p class="subtle plain">' +
                esc(entry.status || "explored") +
                (entry.checkPassed ? " · Check passed" : "") +
                "</p></a>",
            )
            .join("") +
          "</div>"
        : '<p class="muted">Nothing saved yet. <a class="link" href="#/">Explore a topic</a>.</p>')
    );
  }

  function presentView() {
    const index = Math.max(0, Math.min(SLIDES.length - 1, slide));
    const current = SLIDES[index];
    return (
      '<p class="kicker">' +
      esc(current[0]) +
      "</p><h1>" +
      esc(current[1]) +
      '</h1><p class="lede left">' +
      esc(current[2]) +
      '</p><div class="row"><button class="btn secondary" id="prevslide" type="button"' +
      (index === 0 ? " disabled" : "") +
      '>Previous</button><button class="btn" id="nextslide" type="button"' +
      (index === SLIDES.length - 1 ? " disabled" : "") +
      ">Next</button>" +
      (index === SLIDES.length - 1 ? '<a class="chip" href="#/">Return to Eagle Panorama</a>' : "") +
      '</div><p class="subtle plain">Arrow keys or space to advance. Slide ' +
      (index + 1) +
      " of " +
      SLIDES.length +
      ".</p>"
    );
  }

  function bindMap() {
    const board = document.getElementById("board");
    const svg = document.getElementById("atlasvg");
    if (!board || !svg) return;
    let x = 0;
    let y = 0;
    let scale = 0.72;
    let drag = null;
    const apply = () => {
      svg.style.transform = "translate(" + x + "px," + y + "px) scale(" + scale + ")";
    };
    apply();
    board.addEventListener("pointerdown", (event) => {
      drag = { x: event.clientX, y: event.clientY, vx: x, vy: y };
      board.setPointerCapture(event.pointerId);
    });
    board.addEventListener("pointermove", (event) => {
      if (!drag) return;
      x = drag.vx + (event.clientX - drag.x);
      y = drag.vy + (event.clientY - drag.y);
      apply();
    });
    board.addEventListener("pointerup", () => {
      drag = null;
    });
    board.addEventListener(
      "wheel",
      (event) => {
        event.preventDefault();
        scale = Math.min(1.8, Math.max(0.45, scale * (event.deltaY > 0 ? 0.92 : 1.08)));
        apply();
      },
      { passive: false },
    );
  }

  function render() {
    const current = route();
    const active = document.activeElement;
    const keepFocus = active && active.id === "q";
    const caret = keepFocus ? active.selectionStart : null;
    document.querySelectorAll("nav a").forEach((link) => {
      const name = link.getAttribute("data-nav");
      link.classList.toggle("active", (name === "home" && current.name === "home") || name === current.name);
    });
    const app = document.getElementById("app");
    if (current.name === "home") app.innerHTML = home();
    else if (current.name === "map") app.innerHTML = mapView();
    else if (current.name === "atlas") app.innerHTML = atlasView();
    else if (current.name === "present") app.innerHTML = presentView();
    else app.innerHTML = topicView(current);

    const input = document.getElementById("q");
    if (input) {
      input.addEventListener("input", () => {
        lastQuery = input.value;
        searchError = "";
        render();
      });
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          explore(input.value);
        }
      });
      if (keepFocus) {
        input.focus();
        if (caret != null) input.setSelectionRange(caret, caret);
      }
    }
    const go = document.getElementById("go");
    if (go) go.addEventListener("click", () => explore());
    document.querySelectorAll("[data-go]").forEach((button) => {
      button.addEventListener("click", () => explore(button.getAttribute("data-go")));
    });
    document.querySelectorAll("[data-depth]").forEach((button) => {
      button.addEventListener("click", () => {
        depthKey = button.getAttribute("data-depth");
        render();
      });
    });
    document.querySelectorAll("[data-choice]").forEach((button) => {
      button.addEventListener("click", () => {
        choice = Number(button.getAttribute("data-choice"));
        submitted = false;
        render();
      });
    });
    const check = document.getElementById("checkbtn");
    if (check) {
      check.addEventListener("click", () => {
        const topic = BY_ID[route().slug];
        if (!topic || choice == null) return;
        submitted = true;
        const atlas = loadAtlas();
        if (atlas.entries[topic.id]) {
          const passed = choice === topic.check.answer;
          atlas.entries[topic.id].checkPassed = passed;
          if (passed) atlas.entries[topic.id].status = "understood";
          saveAtlas(atlas);
        }
        render();
      });
    }
    document.querySelectorAll("[data-status]").forEach((button) => {
      button.addEventListener("click", () => {
        const topic = BY_ID[route().slug];
        if (!topic) return;
        const atlas = loadAtlas();
        if (atlas.entries[topic.id]) {
          atlas.entries[topic.id].status = button.getAttribute("data-status");
          saveAtlas(atlas);
          render();
        }
      });
    });
    const clear = document.getElementById("clearatlas");
    if (clear) {
      clear.addEventListener("click", () => {
        saveAtlas({ entries: {}, recent: [] });
        render();
      });
    }
    const prev = document.getElementById("prevslide");
    const next = document.getElementById("nextslide");
    if (prev) prev.addEventListener("click", () => { slide = Math.max(0, slide - 1); render(); });
    if (next) next.addEventListener("click", () => { slide = Math.min(SLIDES.length - 1, slide + 1); render(); });
    if (current.name === "map") bindMap();
  }

  window.addEventListener("hashchange", () => {
    choice = null;
    submitted = false;
    depthKey = "intro";
    render();
  });
  window.addEventListener("keydown", (event) => {
    if (route().name !== "present") return;
    if (event.target && (event.target.tagName === "INPUT" || event.target.tagName === "TEXTAREA")) return;
    if (event.key === "ArrowRight" || event.key === " ") {
      event.preventDefault();
      slide = Math.min(SLIDES.length - 1, slide + 1);
      render();
    }
    if (event.key === "ArrowLeft") {
      slide = Math.max(0, slide - 1);
      render();
    }
  });
  render();
})();

  </script>
  <script>
    document.getElementById("copy-code").addEventListener("click", async function (event) {
      event.preventDefault();
      var box = document.getElementById("codebox");
      var area = document.getElementById("code-text");
      var status = document.getElementById("code-status");
      box.classList.add("open");
      status.textContent = "Loading index.html…";
      try {
        var res = await fetch(location.pathname);
        var text = await res.text();
        area.value = text;
        area.focus();
        area.select();
        try {
          await navigator.clipboard.writeText(text);
          status.textContent = "Copied. Paste it over index.html on GitHub, then commit.";
        } catch (err) {
          status.textContent = "Select all in the box (Ctrl+A), copy (Ctrl+C), and paste it over index.html on GitHub.";
        }
      } catch (err) {
        status.textContent = "Could not load the file from this page.";
      }
    });
    document.getElementById("code-close").addEventListener("click", function () {
      document.getElementById("codebox").classList.remove("open");
    });
  </script>
</body>
